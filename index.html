-size:16px;line-height:1.85;white-space:pre-line}.section{font-size:19px;margin:28px 0 13px;letter-spacing:-.4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:750}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.note{font-size:13px;color:var(--muted)}.question{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0;background:#fff}.question h4{margin:0 0 12px;font-size:15px}.option{width:100%;display:flex;gap:10px;align-items:flex-start;border:1px solid #e7e8f0;background:#fff;border-radius:10px;padding:10px 12px;text-align:left;margin:7px 0}.option .letter{color:var(--p);font-weight:900;min-width:22px}.option.selected{background:var(--pale);border-color:#b4aafa}.option.correct{background:#eaf8ef;border-color:#7bcc9a}.option.wrong{background:#fff0f0;border-color:#f1a3a3}.feedback{font-size:13px;margin-top:8px;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.primary,.secondary{border-radius:11px;padding:11px 17px;font-weight:800}.primary{border:1px solid var(--p);background:var(--p);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.result{background:var(--pale);border:1px solid #d5ceff;border-radius:14px;padding:18px;margin-top:18px;font-weight:800}.word{padding:9px 0;border-bottom:1px solid var(--line)}.mobileNav{display:none}.footer{color:var(--muted);font-size:12px;text-align:center;margin:30px 0}.empty{color:var(--muted)}@media(max-width:800px){.wrap{display:block;margin:12px auto;padding:0 10px}aside{display:none;position:static;max-height:none;margin-bottom:12px}.mobileNav{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;width:100%;font:inherit}.panel{padding:19px 15px;border-radius:16px}.heading{font-size:24px}.reading{font-size:15px;padding:16px}.bar{min-height:58px}.brand{font-size:19px}}
</style></head><body><header><div class="bar"><div class="brand">MAGIST <b>PRO</b> <span class="tag">READING 01</span></div><div class="tag">5 ТЕМ · 14 ТЕКСТОВ · 112 ВОПРОСОВ</div></div></header><div class="wrap"><aside id="sidebar"></aside><main><select class="mobileNav" id="mobileNav" aria-label="Выбрать текст"></select><div class="panel"><div id="content"></div></div><div class="footer">MAGIST PRO · Reading Practice · Тексты адаптированы по предоставленным материалам Lingua.com</div></main></div><script>
const DATA=[{"topic": 1, "title": "Asking a Neighbor for Help", "level": "A2", "text": "Cody was building a new fence all day outside. He was almost done when his hammer broke. Cody decided to ask his neighbor Gary if he had a hammer he could borrow to finish.\n\nCody knocked on Gary’s door and waited. “Hey Cody,” Gary said when he answered the door. “How are you?” “Not bad. Yourself?” Cody answered.\n\n“Good!” Gary said. “I see you have a big project going on over there. The fence looks great.” Cody smiled. “Thank you. I am almost done, but my hammer broke. Do you have one I can borrow?” “I sure do,” Gary said.\n\nCody followed Gary into the garage. Gary gave Cody a hammer to borrow. “Thank you,” Cody said. “I really appreciate it. I’ll have it back to you soon.” “Keep it as long as you need,” Gary said with a smile.", "ru": "Коди строил забор, но у него сломался молоток. Он попросил молоток у соседа Гэри. Гэри дал инструмент и разрешил пользоваться им столько, сколько нужно.", "kk": "Коди қоршау салып жатқанда балғасы сынып қалды. Ол көршісі Гэриден балға сұрады. Гэри балғасын беріп, қажет болғанша қолдануға рұқсат етті.", "words": ["neighbor — сосед — көрші", "borrow — одолжить — қарызға алу", "fence — забор — қоршау"], "questions": [{"q": "What was Cody building?", "options": ["A fence", "A house", "A garage", "A shed", "A bridge"], "answer": 0}, {"q": "What happened to Cody’s hammer?", "options": ["It disappeared", "It fell into water", "It broke", "It was stolen", "It became rusty"], "answer": 2}, {"q": "What did Cody do at the door?", "options": ["He rang a bell", "He shouted", "He sat down", "He left a note", "He knocked"], "answer": 4}, {"q": "Who answered the door?", "options": ["Cody", "Gary", "Gary’s wife", "Cody’s brother", "A delivery driver"], "answer": 1}, {"q": "What tool broke?", "options": ["A screwdriver", "A saw", "A drill", "A hammer", "A shovel"], "answer": 3}, {"q": "Where did Cody follow Gary?", "options": ["To the garage", "To the kitchen", "To the garden", "To the car", "To the fence"], "answer": 0}, {"q": "Why did Cody visit Gary?", "options": ["To return a ladder", "To buy some wood", "To borrow a hammer", "To invite him to dinner", "To borrow a saw"], "answer": 2}, {"q": "How long could Cody keep the hammer?", "options": ["Until lunchtime", "For one hour", "Until the next morning", "For exactly two days", "As long as he needed"], "answer": 4}]}, {"topic": 1, "title": "Finding the Perfect Gift for a Friend", "level": "B1", "text": "Choosing a special gift for a friend can be a challenge, especially if you want it to feel personal. The best gifts often reflect the friend’s hobbies, favorite colors, or interests. Some people pay attention during conversations to learn what their friends like or need. Handmade gifts, like a painted picture, a collection of favorite songs, or a homemade cake, can show extra thought and care. Sometimes, friends enjoy shared experiences more than objects, such as tickets to a concert, a movie, or a fun day out together.\n\nIt’s also important to consider the occasion and your budget. Little things, like a nice card with kind words, can mean a lot and do not have to be expensive. Giving a gift can be a way to say thank you, celebrate a birthday, or simply show appreciation for the friendship. Even if the present is simple, the effort and thought behind it can make your friend feel special. In the end, the most important thing is the feeling and message the gift brings.", "ru": "Хороший подарок отражает интересы друга. Подарок ручной работы или совместное впечатление может быть особенно ценным. Важнее всего внимание и смысл подарка, а не цена.", "kk": "Жақсы сыйлық досыңның қызығушылығына сай келеді. Қолдан жасалған сыйлық немесе бірге өткізген уақыт ерекше бағалы болуы мүмкін. Ең маңыздысы — көңіл мен ықылас.", "words": ["thoughtful — внимательный — ықыласты", "budget — бюджет — бюджет", "appreciation — признательность — ризашылық"], "questions": [{"q": "What can make a gift feel personal?", "options": ["Choosing the biggest box", "Buying the most expensive item", "Following every trend", "Reflecting a friend’s interests", "Selecting at random"], "answer": 3}, {"q": "Why listen during conversations?", "options": ["To learn what a friend likes", "To practise a speech", "To choose a restaurant", "To learn a new language", "To plan a work meeting"], "answer": 0}, {"q": "Which handmade gift is mentioned?", "options": ["A leather wallet", "A silver necklace", "A painted picture", "A store voucher", "A new phone"], "answer": 2}, {"q": "What shared experience is mentioned?", "options": ["A new bicycle", "A designer watch", "A kitchen appliance", "A pair of shoes", "Concert tickets"], "answer": 4}, {"q": "What should you consider before choosing a gift?", "options": ["The shop’s opening hours", "The occasion and budget", "The size of the shopping bag", "The weather forecast", "The color of the receipt"], "answer": 1}, {"q": "What matters most in a gift?", "options": ["Its brand name", "Its packaging weight", "Its delivery speed", "Its feeling and message", "Its resale price"], "answer": 3}, {"q": "What is one inexpensive meaningful gift?", "options": ["A card with kind words", "A luxury watch", "An expensive handbag", "A new laptop", "A gold bracelet"], "answer": 0}, {"q": "What can a gift express besides birthday wishes?", "options": ["A demand for a favor", "A work deadline", "Appreciation for friendship", "A travel warning", "A shopping complaint"], "answer": 2}]}, {"topic": 1, "title": "Making New Friends in a Foreign Country", "level": "B2", "text": "Moving to a new country brings many changes, and making friends is often one of the biggest challenges. When you arrive in an unfamiliar place, start by joining social activities, language cafes, or community clubs. This helps you meet people who share similar interests, making it easier to start conversations. Don’t be afraid to say hello or ask questions about local culture, traditions, or favorite places to visit. Taking part in group events, cooking classes, or volunteering also opens up chances to meet locals and other newcomers alike.\n\nDeveloping friendships takes time, especially in a new language or cultural setting. Practice patience and be genuine in your efforts to connect. Learning to listen and share stories helps build trust. Remember, it’s normal to feel nervous at first, but many people are happy to welcome newcomers and share their experiences. As your language and social skills improve, friendships will become stronger and more natural. Finding supportive new friends can make living in a foreign country much more fun and fulfilling, helping you feel at home even when you’re far away.", "ru": "В новой стране друзей помогают найти языковые кафе, клубы и волонтёрство. Терпение, искренность и умение слушать помогают построить доверие и почувствовать себя как дома.", "kk": "Жаңа елде достар табуға тіл клубтары, қоғамдық іс-шаралар мен еріктілік көмектеседі. Сабырлылық, шынайылық және тыңдай білу сенім қалыптастырады.", "words": ["newcomer — новичок — жаңадан келген адам", "volunteering — волонтёрство — еріктілік", "trust — доверие — сенім"], "questions": [{"q": "What is a common challenge after moving abroad?", "options": ["Finding a new television", "Making friends", "Buying souvenirs", "Choosing a recipe", "Learning to knit"], "answer": 1}, {"q": "Where can newcomers meet people with similar interests?", "options": ["Empty parking lots", "Private offices after hours", "Closed shops", "Community clubs", "Quiet storage rooms"], "answer": 3}, {"q": "Why join group events or volunteer?", "options": ["To meet locals and newcomers", "To avoid all conversations", "To replace language learning", "To get a guaranteed job", "To stop exploring the city"], "answer": 0}, {"q": "What attitude helps develop friendships?", "options": ["Impatience and secrecy", "Competition and suspicion", "Patience and sincerity", "Silence and avoidance", "Pressure and criticism"], "answer": 2}, {"q": "How can listening and sharing stories help?", "options": ["They shorten a flight", "They reduce rent", "They teach cooking instantly", "They remove all language barriers", "They build trust"], "answer": 4}, {"q": "What benefit can supportive friends bring?", "options": ["Never needing to study", "Feeling at home abroad", "Avoiding all travel", "Getting automatic citizenship", "No longer needing a job"], "answer": 1}, {"q": "What can you ask locals about?", "options": ["Their bank passwords", "Their private medical files", "Their account numbers", "Culture and favorite places", "Their work passwords"], "answer": 3}, {"q": "How may friendships change as skills improve?", "options": ["They become stronger and more natural", "They disappear immediately", "They require no communication", "They become less meaningful", "They stop involving shared experiences"], "answer": 0}]}, {"topic": 2, "title": "Making Tacos with My Family", "level": "Beginner", "text": "My family and I like to eat tacos. They taste really good. My dad makes the best tacos. Sometimes my brother and I will help my dad make tacos.\n\nMy dad cooks the beef. My brother and I do not because the stove is hot. Then my dad cuts the lettuce and the tomatoes.\n\nMy dad puts the beef into the taco shells. My brother and I like to put the cheese in after that. The cheese melts after we put it in because the beef is hot. My brother and I like to help put the lettuce and tomatoes in too.\n\nI can only eat one taco. My brother can eat two tacos.", "ru": "Семья любит тако. Папа готовит мясо и нарезает овощи, а дети добавляют сыр и овощи. Рассказчик съедает один тако, а его брат — два.", "kk": "Отбасы тако жегенді ұнатады. Әкесі ет пісіріп, көкөніс турайды, ал балалар ірімшік пен көкөніс қосады. Әңгімелеуші бір тако, ағасы екі тако жейді.", "words": ["stove — плита — пеш", "lettuce — салат-латук — салат жапырағы", "melt — таять — еру"], "questions": [{"q": "What does the family make together?", "options": ["Pizza", "Hamburgers", "Pasta", "Pancakes", "Tacos"], "answer": 4}, {"q": "Who puts the beef into the taco shells?", "options": ["Brother", "Dad", "Sister", "Mom", "Grandma"], "answer": 1}, {"q": "What vegetables does Dad cut?", "options": ["Carrots and onions", "Cucumbers and peppers", "Potatoes and beans", "Lettuce and tomatoes", "Cabbage and corn"], "answer": 3}, {"q": "Why do the children not cook the beef?", "options": ["The stove is hot", "They dislike beef", "They are at school", "The kitchen is closed", "They have no pan"], "answer": 0}, {"q": "Why does the cheese melt?", "options": ["The lettuce is cold", "The shell is wet", "The beef is hot", "The tomatoes are sweet", "The kitchen is dark"], "answer": 2}, {"q": "How many tacos can the brother eat?", "options": ["One", "Three", "Four", "Five", "Two"], "answer": 4}, {"q": "What do the children add after the beef?", "options": ["Rice", "Cheese", "Fish", "Eggs", "Soup"], "answer": 1}, {"q": "How many tacos can the narrator eat?", "options": ["Two", "Three", "Four", "One", "Five"], "answer": 3}]}, {"topic": 2, "title": "Supporting a Family Member Facing a Big Decision", "level": "B1", "text": "When a family member has to make an important decision, offering support can make a significant difference. My older brother was recently offered a job in another city, which would require him to move away from us for the first time. He was torn between the exciting opportunity and the comfort of staying close to family. Our family gathered one evening and listened as he shared his worries and hopes. We gave advice, suggested ways to stay in touch, and assured him that we would support whatever choice he made.\n\nDuring these conversations, I realized the power of simply listening. Instead of telling him what to do, we helped him weigh his options and feel confident in his decision. When he finally decided to accept the new job, we celebrated his courage and reminded him that home would always be here for him. Supporting someone during a big life decision isn’t about giving the right answer; it’s about showing empathy and trust in their ability to choose their own path.", "ru": "Старшему брату предложили работу в другом городе. Семья выслушала его сомнения и поддержала решение переехать. Настоящая поддержка — это сочувствие, доверие и умение слушать.", "kk": "Ағасына басқа қаладан жұмыс ұсынылды. Отбасы оның уайымын тыңдап, көшу шешімін қолдады. Нағыз қолдау — жанашырлық, сенім және тыңдай білу.", "words": ["opportunity — возможность — мүмкіндік", "empathy — сочувствие — жанашырлық", "assure — заверять — сендіру"], "questions": [{"q": "Why was the older brother uncertain?", "options": ["He disliked the offered salary", "He had lost his passport", "He was torn between opportunity and family", "He could not speak the language", "He wanted to change his name"], "answer": 2}, {"q": "How did the family support him?", "options": ["They made the decision for him", "They refused to discuss it", "They cancelled the job offer", "They insisted he stay", "They listened and offered advice"], "answer": 4}, {"q": "What did the narrator learn?", "options": ["Advice is never useful", "Listening can be powerful", "Moving always fails", "Families should decide careers", "Jobs matter more than people"], "answer": 1}, {"q": "How did the family respond when he accepted?", "options": ["They stopped speaking to him", "They demanded he return", "They criticized his decision", "They celebrated his courage", "They cancelled the celebration"], "answer": 3}, {"q": "What is the main message?", "options": ["Support means empathy and trust", "Always choose the closest job", "Never discuss family concerns", "Avoid making difficult decisions", "Relatives must agree on everything"], "answer": 0}, {"q": "What did they discuss to stay connected?", "options": ["Selling the family home", "Changing his profession", "Ways to stay in touch", "Cancelling his phone", "Avoiding visits"], "answer": 2}, {"q": "Where was the new job located?", "options": ["In the same house", "In a nearby school", "In his hometown street", "In a foreign village", "In another city"], "answer": 4}, {"q": "What did the family help him weigh?", "options": ["His luggage", "His options", "His groceries", "His exercise routine", "His weekly meals"], "answer": 1}]}, {"topic": 2, "title": "Finding Joy in Everyday Family Routines", "level": "C1", "text": "Amid the busyness of daily life, it’s easy to overlook the steady routines that quietly bring a family together. Simple acts such as preparing breakfast together, sharing a nightly walk, or reading aloud before bedtime can become cherished rituals that anchor everyone emotionally despite the pressures of school, work, or social obligations. These seemingly mundane routines create a sense of continuity, reassurance, and belonging that is especially valuable during periods of change or uncertainty.\n\nOver time, the repetition of these routines can foster important values and habits—like cooperation, patience, and reliable communication—that benefit every member of the household. While it may be tempting to focus on the extraordinary or wait for special occasions to feel connected, recognizing the joy in everyday togetherness often leads to the most profound happiness. Taking a moment to acknowledge and be present during these routine interactions not only strengthens relationships but also helps families create positive memories that endure well beyond the daily grind.", "ru": "Обычные семейные ритуалы — завтрак, прогулка, чтение — создают чувство стабильности и близости. Они развивают терпение, сотрудничество и общение. Радость повседневности укрепляет семью.", "kk": "Күнделікті отбасылық әдеттер — таңғы ас, серуен, кітап оқу — тұрақтылық пен жақындық сезімін береді. Олар сабырлылықты, ынтымақтастықты және қарым-қатынасты дамытады.", "words": ["cherished — дорогой сердцу — қадірлі", "reassurance — уверенность — сенімділік", "belonging — сопричастность — тиесілілік"], "questions": [{"q": "What do family routines provide during uncertainty?", "options": ["Continuity and reassurance", "Constant excitement", "Financial independence", "More competition", "Fewer shared experiences"], "answer": 0}, {"q": "Which routine is mentioned?", "options": ["Traveling abroad every weekend", "Shopping every night", "Preparing breakfast together", "Holding daily business meetings", "Changing houses monthly"], "answer": 2}, {"q": "What values can routines develop?", "options": ["Secrecy and avoidance", "Competition and risk-taking", "Isolation and impatience", "Independence without communication", "Cooperation and patience"], "answer": 4}, {"q": "What should families recognize in everyday life?", "options": ["The need for costly holidays", "Joy in togetherness", "The importance of new possessions", "The value of formal meetings", "The need to avoid routines"], "answer": 1}, {"q": "What does being present help create?", "options": ["Complete agreement on everything", "A life without stress", "More household rules", "Positive lasting memories", "Less time together"], "answer": 3}, {"q": "What is easy to overlook?", "options": ["Quiet routines that bring family together", "A school timetable", "Expensive celebrations", "An important email", "A new television"], "answer": 0}, {"q": "When can routines be especially valuable?", "options": ["When nobody is home", "During solitary travel", "During periods of change", "When communication stops", "During shopping only"], "answer": 2}, {"q": "What may extraordinary occasions distract from?", "options": ["Homework deadlines", "Cooking skills", "Travel expenses", "House repairs", "Everyday connection"], "answer": 4}]}, {"topic": 3, "title": "My Job", "level": "Beginner", "text": "I work at a restaurant. At my job, I am very busy all day. My restaurant makes hamburgers, fried chicken, soup, and salad. I do not make the food, but I do serve the food to the customers. I bring the customers drinks, and then I ask them what they would like to eat. I say, “May I take your order?”\n\nThe customers tell me their order. I write it down in my small notebook, and then I type the order into the computer. The cooks in the kitchen receive the order, and they make the food. I bring the food to the table. Everyone in town thinks the food at my restaurant is delicious. I agree. My favorite food is the fried chicken.", "ru": "Рассказчик работает официантом в ресторане. Он принимает заказы, записывает их и передаёт поварам через компьютер. Его любимое блюдо — жареная курица.", "kk": "Әңгімелеуші мейрамханада даяшы болып жұмыс істейді. Ол тапсырыстарды жазып, компьютер арқылы аспаздарға жібереді. Сүйікті тағамы — қуырылған тауық.", "words": ["order — заказ — тапсырыс", "customer — клиент — тұтынушы", "serve — обслуживать — қызмет көрсету"], "questions": [{"q": "Where does the narrator work?", "options": ["At a school", "At a hospital", "At a bank", "At a restaurant", "At a library"], "answer": 3}, {"q": "What is the narrator’s favorite food?", "options": ["Fried chicken", "Hamburgers", "Salad", "Soup", "Pizza"], "answer": 0}, {"q": "What do people in town think of the food?", "options": ["It is too cold", "It is too spicy", "It is delicious", "It is too expensive", "It is unhealthy"], "answer": 2}, {"q": "Who prepares the food?", "options": ["The waiter", "The customers", "The computer", "The manager", "The cooks"], "answer": 4}, {"q": "Where do the cooks work?", "options": ["At the table", "In the kitchen", "At the entrance", "At the cashier desk", "Outside the building"], "answer": 1}, {"q": "Where is the order first written?", "options": ["On a wall", "On a receipt", "On a phone screen", "In a small notebook", "On a menu"], "answer": 3}, {"q": "What does the narrator bring to customers first?", "options": ["Drinks", "Bills", "Uniforms", "Recipes", "Shopping bags"], "answer": 0}, {"q": "What does the narrator do after writing an order?", "options": ["Goes home", "Cooks the meal", "Types it into a computer", "Cleans the windows", "Calls another restaurant"], "answer": 2}]}, {"topic": 3, "title": "Work at Home vs. At Office", "level": "A2", "text": "Hello! My name is Regina, and I am self employed. I run a small business from my house selling insurance. What I like about my job is that I have a very flexible schedule, and I can pick how many hours and days per week I work. Normally, I work four days a week, and I try to average 25 hours over those four days. I save a lot of time by working at home because I do not have to worry about driving through a busy commute every day. Frequently, I have meetings over the phone or using the computer with my clients, and sometimes I will travel to meet with clients in person. My job is great because it gives me three-day weekends, and on slower weeks I can work less and get caught up on household chores and my other responsibilities.\n\nHi! I’m Thomas and I work in the city for a marketing company. I live in the suburbs, so each day I travel by train using a monthly rail pass. The rail pass saves me money, and I don’t have to worry about busy traffic each day by driving into the city. I normally work a 40-hour week. During the work day, I have a lot of responsibilities. I try to arrive at the office 15 minutes early to get settled, but throughout the day I have meetings with my boss and coworkers, and I have to handle many emails and phone calls with clients. I receive a one hour lunch break in the middle of the day. Usually, I pack a lunch to save money, but on Fridays I always go out to a cafe or restaurant to grab a bite to eat. I like my job because I have a lot of interaction with other people, and the days go by very quickly.", "ru": "Реджина работает дома и продаёт страховки, сама выбирая график. Томас работает в маркетинговой компании в городе, ездит на поезде и общается с коллегами.", "kk": "Реджина үйден сақтандыру сатып, жұмыс кестесін өзі белгілейді. Томас қаладағы маркетинг компаниясында жұмыс істеп, пойызбен қатынайды және әріптестерімен араласады.", "words": ["commute — дорога на работу — жұмысқа қатынау", "flexible — гибкий — икемді", "coworker — коллега — әріптес"], "questions": [{"q": "What is Regina’s job?", "options": ["Writer", "Insurance salesperson", "Painter", "Housekeeper", "Chef"], "answer": 1}, {"q": "How many days does Regina usually work?", "options": ["Three", "Five", "Six", "Four", "Seven"], "answer": 3}, {"q": "Which is NOT a benefit Regina mentions?", "options": ["Making more money", "Flexible schedule", "Saving commuting time", "Working from home", "Three-day weekends"], "answer": 0}, {"q": "What industry does Thomas work in?", "options": ["Architecture", "Pharmaceuticals", "Marketing", "Engineering", "Education"], "answer": 2}, {"q": "How does Thomas travel to work?", "options": ["By car", "By bicycle", "On foot", "By taxi", "By train"], "answer": 4}, {"q": "What is the text mainly about?", "options": ["Two people looking for jobs", "Two people with different working arrangements", "Two people planning holidays", "Two people changing careers", "Two people starting a business together"], "answer": 1}, {"q": "How many hours does Thomas work weekly?", "options": ["Twenty", "Twenty-five", "Thirty", "Forty", "Fifty"], "answer": 3}, {"q": "When does Thomas usually eat at a restaurant?", "options": ["On Fridays", "Every Monday", "Every morning", "On Tuesdays", "Every Sunday"], "answer": 0}]}, {"topic": 3, "title": "Navigating the First Days in a New Workplace", "level": "B2", "text": "Starting a new job can be both exciting and intimidating. Adjusting to unfamiliar routines, learning about organizational culture, and meeting new colleagues often generate a mix of anticipation and nervousness. It’s normal to feel uncertain during these first days, as each workplace has its own unspoken rules and expectations. Simple actions, like greeting coworkers with a smile, asking respectful questions, and expressing willingness to learn, help lay the foundation for positive relationships and a smooth adjustment period.\n\nPatience is crucial as one gets accustomed to new responsibilities and office dynamics. Rather than aiming for instant mastery, it’s better to focus on absorbing information and observing how others interact. Finding a mentor or an approachable colleague can provide guidance and reduce the sense of isolation. Over time, small successes—like contributing an idea in a meeting or mastering a new tool—bring greater confidence. Looking back, many people realize that those initial uncertainties faded faster than they expected, replaced by a sense of belonging and purpose within their new team.", "ru": "На новой работе нормально волноваться. Вежливые вопросы, наблюдение, терпение и поддержка наставника помогают адаптироваться. Маленькие успехи постепенно придают уверенность.", "kk": "Жаңа жұмыста қобалжу қалыпты жағдай. Сыпайы сұрақтар, бақылау, сабыр және тәлімгердің көмегі бейімделуге ықпал етеді. Шағын жетістіктер сенімділікті арттырады.", "words": ["mentor — наставник — тәлімгер", "belonging — чувство причастности — тиесілілік", "adjustment — адаптация — бейімделу"], "questions": [{"q": "What feeling is common when starting a new job?", "options": ["Only boredom", "Complete confidence", "Permanent anger", "Total indifference", "A mix of excitement and nervousness"], "answer": 4}, {"q": "What can help during the first days?", "options": ["Avoiding all coworkers", "Greeting coworkers and asking respectful questions", "Demanding immediate answers", "Refusing new tasks", "Ignoring workplace rules"], "answer": 1}, {"q": "What is recommended instead of instant mastery?", "options": ["Working alone without guidance", "Making sudden changes", "Ignoring feedback", "Observing and absorbing information", "Leaving early every day"], "answer": 3}, {"q": "How can a mentor help?", "options": ["Offer guidance and reduce isolation", "Increase the workload", "Delay adaptation", "Prevent questions", "Complicate every routine"], "answer": 0}, {"q": "What may replace initial uncertainty?", "options": ["Permanent confusion", "Greater fear", "A sense of belonging and purpose", "More isolation", "Less motivation"], "answer": 2}, {"q": "Which is a small success?", "options": ["Skipping all meetings", "Avoiding discussions", "Ignoring a new tool", "Refusing responsibilities", "Contributing an idea in a meeting"], "answer": 4}, {"q": "Why is patience important?", "options": ["All tasks are already familiar", "Adjustment takes time", "Coworkers never help", "Questions are discouraged", "Office routines never change"], "answer": 1}, {"q": "What do workplaces have that may be unspoken?", "options": ["Identical schedules everywhere", "No responsibilities", "Guaranteed promotions", "Rules and expectations", "No social dynamics"], "answer": 3}]}, {"topic": 4, "title": "Learning How to Knit a Scarf", "level": "Beginner", "text": "My grandma taught me how to knit a scarf when I was eight years old. It is not hard to knit a scarf. First, you need two knitting needles. Then you need yarn. You should pick a color you like. For my first scarf, I picked yellow because that is my favorite color.\n\nMy grandma gave me my first knitting needles. They were made of wood. She said wood was easier for me to hold with my little hands.\n\nThen she showed me how to knit. The first step is to make a slip knot and put it on one of the knitting needles. Then you make more loops around the knitting needle. After that, you use both needles to knit. My first scarf was not the best one I ever made, but I was proud of it.", "ru": "Бабушка научила рассказчицу вязать в восемь лет. Для первого шарфа она выбрала жёлтую пряжу и деревянные спицы. Шарф получился неидеальным, но она им гордилась.", "kk": "Әжесі әңгімелеушіні сегіз жасында тоқуға үйретті. Алғашқы шарфына сары жіп пен ағаш біз таңдады. Шарф мінсіз болмаса да, ол оны мақтан тұтты.", "words": ["knit — вязать — тоқу", "yarn — пряжа — жіп", "needle — спица — біз"], "questions": [{"q": "Who taught the narrator to knit?", "options": ["Her mother", "Her father", "Her grandma", "Her brother", "Her teacher"], "answer": 2}, {"q": "How old was she when she first knitted?", "options": ["Ten", "Twelve", "Thirteen", "Six", "Eight"], "answer": 4}, {"q": "What color did she choose?", "options": ["Blue", "Yellow", "Green", "Red", "Purple"], "answer": 1}, {"q": "What were her first needles made of?", "options": ["Metal", "Plastic", "Bamboo", "Wood", "Glass"], "answer": 3}, {"q": "Who gave her the needles?", "options": ["Her grandma", "Her aunt", "Her friend", "Her father", "Her neighbor"], "answer": 0}, {"q": "How did she feel about her first scarf?", "options": ["Ashamed of it", "Angry about it", "Proud of it", "Bored with it", "Afraid of it"], "answer": 2}, {"q": "What is the first step in knitting described?", "options": ["Cut the finished scarf", "Wash the yarn", "Sew on a button", "Paint the needles", "Make a slip knot"], "answer": 4}, {"q": "Why did Grandma choose wooden needles?", "options": ["They were the most expensive", "They were easier for small hands to hold", "They were very heavy", "They were brightly painted", "They were disposable"], "answer": 1}]}, {"topic": 4, "title": "The Art of Saying No Politely", "level": "B2", "text": "Learning how to say no is an important skill for building healthy relationships and managing your own stress. Sometimes, people may ask for favors or invite you to events that you do not want to attend. While it is normal to want to help others, accepting every request can lead to exhaustion. To refuse an invitation or extra responsibility politely, it is useful to thank the other person for thinking of you and then offer a brief but honest explanation for your decision.\n\nPracticing polite ways of saying no can actually strengthen your relationships. When you draw clear boundaries, others are more likely to respect your needs and trust your honesty. For example, you can say, “I’m sorry, I have other commitments that day,” or “Thank you for inviting me, but I need some time for myself.” Over time, expressing your limits in a kind way can help you maintain a balance between helping others and taking care of your own well-being.", "ru": "Вежливый отказ помогает сохранять личные границы и избегать усталости. Лучше поблагодарить человека и кратко объяснить причину. Честность и уважение укрепляют отношения.", "kk": "Сыпайы бас тарту жеке шекараны сақтауға және шаршамауға көмектеседі. Адамға алғыс айтып, себебін қысқаша түсіндірген дұрыс. Адалдық пен сыйластық қарым-қатынасты нығайтады.", "words": ["boundary — граница — шекара", "exhaustion — истощение — шаршау", "commitment — обязательство — міндеттеме"], "questions": [{"q": "Why is saying no important?", "options": ["It helps manage stress and relationships", "It makes others dependent", "It increases workload", "It encourages every invitation", "It avoids all social contact"], "answer": 0}, {"q": "What can happen if you accept every request?", "options": ["You automatically improve relationships", "Everyone stops asking favors", "You may become exhausted", "You gain unlimited free time", "You never feel stressed"], "answer": 2}, {"q": "How should you refuse an invitation politely?", "options": ["Criticize the invitation", "Ignore the message", "Accept then cancel at the last minute", "Blame someone else", "Thank the person and explain honestly"], "answer": 4}, {"q": "What can polite boundaries do?", "options": ["Create permanent confusion", "Strengthen relationships", "End all friendships", "Make honesty unnecessary", "Prevent communication"], "answer": 1}, {"q": "Which is a polite refusal?", "options": ["Why did you invite me?", "I do not like your events", "Never ask me again", "I have other commitments that day", "Your invitation is pointless"], "answer": 3}, {"q": "What is a benefit of kind limits?", "options": ["Balancing care for others and yourself", "Always putting others first", "Avoiding every responsibility", "Becoming unreliable", "Stopping all invitations"], "answer": 0}, {"q": "What should a refusal explanation be?", "options": ["Long and invented", "Angry and personal", "Brief and honest", "Vague and insulting", "Public and embarrassing"], "answer": 2}, {"q": "What are others more likely to respect when you set boundaries?", "options": ["Your shopping list", "Your favorite color", "Your travel tickets", "Your office furniture", "Your needs"], "answer": 4}]}, {"topic": 5, "title": "How to Stay Healthy", "level": "A2", "text": "Staying healthy is important for a happy life. Every day, it is good to eat fruits and vegetables, drink enough water, and not eat too much sugar or fast food. Try to get enough sleep every night. This will help your body and mind work well. Also, move your body, even if it is only a short walk, some simple exercises, or playing with friends.\n\nWashing your hands before eating and after using the toilet is also important. Try not to touch your face too much with your hands. Sometimes people feel sad, tired, or stressed. You can talk to someone you trust, or do something you enjoy, like listening to music. Taking care of your body and mind helps you feel good every day.", "ru": "Для здоровья важно есть овощи и фрукты, пить воду, спать, двигаться и мыть руки. Если грустно или тревожно, можно поговорить с человеком, которому доверяешь.", "kk": "Денсаулық үшін жеміс-көкөніс жеп, су ішіп, ұйықтап, қозғалып, қол жуу маңызды. Көңілсіз болсаң, сенетін адамыңмен сөйлесуге болады.", "words": ["healthy — здоровый — дені сау", "trust — доверять — сену", "exercise — упражнение — жаттығу"], "questions": [{"q": "What should you eat every day?", "options": ["Only sweets", "Only fast food", "Only fried food", "Fruits and vegetables", "Only bread"], "answer": 3}, {"q": "Why is sleep important?", "options": ["It helps body and mind work well", "It prevents all exercise", "It replaces drinking water", "It makes vegetables unnecessary", "It stops social contact"], "answer": 0}, {"q": "When should you wash your hands?", "options": ["After watching television", "Before going for a walk", "Before eating and after using the toilet", "After listening to music", "Before reading a book"], "answer": 2}, {"q": "What is a good way to move your body?", "options": ["Watching videos all day", "Eating more sweets", "Sitting for many hours", "Skipping exercise", "Taking a short walk"], "answer": 4}, {"q": "What can you do if you feel stressed?", "options": ["Drink less water", "Talk to someone you trust", "Avoid all friends", "Skip sleeping", "Eat more fast food"], "answer": 1}, {"q": "Why avoid touching your face too much?", "options": ["To improve eyesight immediately", "To grow taller", "To become stronger instantly", "To help keep yourself healthy", "To stop feeling hungry"], "answer": 3}, {"q": "What should you drink enough of?", "options": ["Water", "Soda", "Energy drinks", "Sweet syrup", "Coffee only"], "answer": 0}, {"q": "What relaxing activity is mentioned?", "options": ["Driving in traffic", "Doing extra paperwork", "Listening to music", "Skipping meals", "Working all night"], "answer": 2}]}, {"topic": 5, "title": "Recognizing Warning Signs of a Stroke", "level": "B2", "text": "A stroke happens when the blood supply to part of the brain is interrupted or reduced, which stops the brain from getting oxygen and nutrients. This can lead to rapid brain cell death and requires immediate medical attention. Common warning signs include sudden numbness or weakness in the face, arm, or leg, especially on one side of the body. You might also notice confusion, trouble speaking clearly, or difficulty understanding others. Other symptoms can be problems seeing in one or both eyes and sudden trouble walking, dizziness, or loss of balance.\n\nIf you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred speech; Time—if you see any of these signs, call emergency services right away. Quick action is very important. The sooner a stroke victim gets medical help, the better their chance of minimizing damage and making a good recovery.", "ru": "Инсульт происходит, когда нарушается кровоснабжение мозга. Внезапная слабость, нарушение речи или равновесия — тревожные признаки. Тест FAST помогает распознать симптомы; нужно немедленно вызвать скорую помощь.", "kk": "Инсульт миға қан келуі бұзылғанда болады. Кенет әлсіздік, сөйлеу немесе тепе-теңдік бұзылысы — қауіпті белгілер. FAST тесті белгілерді тануға көмектеседі; жедел жәрдем шақыру қажет.", "words": ["stroke — инсульт — инсульт", "numbness — онемение — ұю", "emergency — экстренная ситуация — шұғыл жағдай"], "questions": [{"q": "What causes a stroke?", "options": ["Too much oxygen to the brain", "Reduced or interrupted blood supply to the brain", "A broken leg", "A mild headache after reading", "A stomach infection"], "answer": 1}, {"q": "Which is a common warning sign?", "options": ["A cough for several days", "Slow hair growth", "A mild appetite change", "Sudden weakness on one side", "A small skin scratch"], "answer": 3}, {"q": "What does F in FAST mean?", "options": ["Face", "Feet", "Fatigue", "Fingers", "Food"], "answer": 0}, {"q": "What should you do if you suspect a stroke?", "options": ["Wait several days", "Offer a large meal", "Call emergency services immediately", "Ask the person to sleep", "Ignore the symptoms"], "answer": 2}, {"q": "Why is quick action important?", "options": ["It prevents common colds", "It removes the need for doctors", "It guarantees no further problems", "It makes symptoms harmless", "It may reduce damage and improve recovery"], "answer": 4}, {"q": "Which symptom is NOT mentioned?", "options": ["Dizziness", "Persistent fever", "Trouble walking", "Vision problems", "Sudden numbness"], "answer": 1}, {"q": "What do you check in the Arms part of FAST?", "options": ["Whether fingers can snap", "Whether legs can jump", "Whether hands are cold", "Whether one raised arm drifts downward", "Whether shoulders are relaxed"], "answer": 3}, {"q": "What does T in FAST remind you?", "options": ["Time to call emergency services", "Take a nap", "Try eating something", "Travel to work", "Test again next week"], "answer": 0}]}, {"topic": 5, "title": "Taking Care of Your Teeth", "level": "B1", "text": "Good teeth are important for a happy smile. You should brush your teeth every morning and every night. Use a toothbrush and a little toothpaste. Brush your teeth gently for two minutes. Remember to brush all your teeth, not just the front ones. After brushing, rinse your mouth with clean water.\n\nYou should also see a dentist twice a year. The dentist checks your teeth and helps keep them healthy. Do not eat too many sweets, as they can hurt your teeth. Drink water instead of soda. Taking care of your teeth every day is easy. Healthy teeth help you eat, speak, and smile with confidence.", "ru": "Чтобы сохранить зубы здоровыми, нужно чистить их утром и вечером по две минуты, полоскать рот водой и посещать стоматолога дважды в год. Лучше пить воду вместо газировки.", "kk": "Тісті сау сақтау үшін таңертең және кешке екі минут тазалап, ауызды сумен шайып, жылына екі рет тіс дәрігеріне қаралу керек. Газдалған сусынның орнына су ішкен дұрыс.", "words": ["toothbrush — зубная щётка — тіс щеткасы", "dentist — стоматолог — тіс дәрігері", "rinse — полоскать — шаю"], "questions": [{"q": "How often should you brush your teeth?", "options": ["Once a week", "Only after sweets", "Once a month", "Only in the morning", "Every morning and night"], "answer": 4}, {"q": "What should you use to brush your teeth?", "options": ["A spoon and salt", "A toothbrush and toothpaste", "A hairbrush and water", "A towel and soap", "A finger and soap"], "answer": 1}, {"q": "How long should you brush?", "options": ["Ten seconds", "Half an hour", "Ten minutes", "Two minutes", "One hour"], "answer": 3}, {"q": "Why should you visit a dentist twice a year?", "options": ["To check and keep teeth healthy", "To buy sweets", "To learn games", "To avoid brushing", "To get a new toothbrush daily"], "answer": 0}, {"q": "What should you drink instead of soda?", "options": ["Milkshakes", "Lemonade", "Water", "Energy drinks", "Sweet juice"], "answer": 2}, {"q": "What do healthy teeth help you do?", "options": ["Run faster", "Hear better", "See at night", "Sleep less", "Eat, speak, and smile confidently"], "answer": 4}, {"q": "Which teeth should you brush?", "options": ["Only the front teeth", "All teeth, not just the front ones", "Only the upper teeth", "Only the back teeth", "Only the lower teeth"], "answer": 1}, {"q": "What should you do after brushing?", "options": ["Eat candy immediately", "Drink soda", "Skip rinsing", "Rinse your mouth with clean water", "Brush with soap"], "answer": 3}]}];

const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){let out='<h2>READING · PART 1</h2>';TOPICS.forEach((t,i)=>{out+='<div class="topic"><div class="topic-title">'+(i+1)+'. '+esc(t)+'</div>';DATA.forEach((d,j)=>{if(d.topic===i+1)out+='<button class="nav '+(j===current?'active':'')+'" onclick="go('+j+')"><span class="num">'+(j+1)+'</span><span>'+esc(d.title)+'</span></button>'});out+='</div>'});$('sidebar').innerHTML=out;let s=$('mobileNav');s.innerHTML=DATA.map((d,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(d.title)+'</option>').join('');s.value=current;s.onchange=()=>go(+s.value)}
function go(i){current=i;mode='quiz';tab='text';render();window.scrollTo({top:0,behavior:'instant'})}function setTab(t){tab=t;render()}function setMode(m){mode=m;render()}function choose(i,j){if(submitted[current])return;answers[current]??={};answers[current][i]=j;renderQuestions()}function reset(){answers[current]={};submitted[current]=false;render()}function finish(){submitted[current]=true;render()}
function renderQuestions(){let d=DATA[current],a=answers[current]||{},done=!!submitted[current];let out='<div class="tabs"><button class="tab '+(mode==='quiz'?'active':'')+'" onclick="setMode(\'quiz\')">Квиз</button><button class="tab '+(mode==='test'?'active':'')+'" onclick="setMode(\'test\')">Тест</button></div><p class="note">'+(mode==='quiz'?'В режиме «Квиз» правильность ответа видна после выбора.':'В режиме «Тест» ответы проверяются после нажатия «Завершить тест».')+'</p>';
d.questions.forEach((q,i)=>{let selected=a[i],show=done||(mode==='quiz'&&selected!==undefined);out+='<div class="question"><h4>'+(i+1)+'. '+esc(q.q)+'</h4>';q.options.forEach((opt,j)=>{let cls=selected===j?' selected':'';if(show&&j===q.answer)cls=' correct';else if(show&&selected===j&&j!==q.answer)cls=' wrong';out+='<button class="option'+cls+'" '+(done?'disabled':'')+' onclick="choose('+i+','+j+')"><span class="letter">'+String.fromCharCode(65+j)+')</span><span>'+esc(opt)+'</span></button>'});if(show)out+='<div class="feedback" style="color:'+(selected===q.answer?'#167345':'#b33b3b')+'">'+(selected===q.answer?'✓ Верно':'✗ Правильный ответ: '+String.fromCharCode(65+q.answer)+') '+esc(q.options[q.answer]))+'</div>';out+='</div>'});let n=Object.keys(a).length;out+='<div class="actions">'+(!done?'<button class="primary" onclick="finish()">Завершить тест</button>':'')+'<button class="secondary" onclick="reset()">Пройти заново</button></div>';if(done){let score=d.questions.filter((q,i)=>a[i]===q.answer).length;out+='<div class="result">Результат: '+score+' / '+d.questions.length+' · '+Math.round(100*score/d.questions.length)+'%</div>'}else out+='<p class="note">Отвечено: '+n+' из '+d.questions.length+'</p>';$('questions').innerHTML=out}
function render(){let d=DATA[current];nav();let out='<div class="eyebrow">ТЕМА '+d.topic+' / '+TOPICS[d.topic-1]+'</div><h1 class="heading">'+esc(d.title)+'</h1><div class="meta"><span class="pill">Уровень '+esc(d.level)+'</span><span class="pill">8 вопросов</span><span class="pill">5 вариантов A–E</span></div><div class="tabs"><button class="tab '+(tab==='text'?'active':'')+'" onclick="setTab(\'text\')">English text</button><button class="tab '+(tab==='ru'?'active':'')+'" onclick="setTab(\'ru\')">Русский</button><button class="tab '+(tab==='kk'?'active':'')+'" onclick="setTab(\'kk\')">Қазақша</button><button class="tab '+(tab==='vocab'?'active':'')+'" onclick="setTab(\'vocab\')">Vocabulary</button></div>';
if(tab==='text')out+='<div class="reading">'+esc(d.text)+'</div>';else if(tab==='ru')out+='<p class="note">Краткое содержание на русском</p><div class="reading">'+esc(d.ru)+'</div>';else if(tab==='kk')out+='<p class="note">Қазақша қысқаша мазмұны</p><div class="reading">'+esc(d.kk)+'</div>';else out+='<div class="reading">'+d.words.map(w=>'<div class="word">'+esc(w)+'</div>').join('')+'</div>';
out+='<h2 class="section">Reading comprehension · 8 questions</h2><div id="questions"></div><div class="actions"><button class="secondary" '+(current===0?'disabled':'')+' onclick="go('+Math.max(0,current-1)+')">← Предыдущий</button><button class="primary" '+(current===DATA.length-1?'disabled':'')+' onclick="go('+Math.min(DATA.length-1,current+1)+')">Следующий →</button></div>';$('content').innerHTML=out;renderQuestions()};render();
</script></body></html>
