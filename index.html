<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIST PRO — Reading Part 1</title><style>
:root{--purple:#5545ee;--ink:#1c2742;--muted:#65718b;--border:#dfe5f4;--bg:#f8f9fe}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--border)}.bar{max-width:1080px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand b{color:var(--purple)}.switch{background:#f0efff;border-radius:30px;padding:4px;display:flex;gap:4px}.switch button{border:0;border-radius:24px;padding:7px 15px;font-weight:800;background:transparent;color:var(--ink);cursor:pointer}.switch button.active{background:var(--purple);color:white}.container{max-width:1080px;margin:auto;padding:30px 20px}.eyebrow{color:var(--purple);font-weight:850;letter-spacing:1.6px;font-size:12px}.intro h1{font-size:clamp(28px,4vw,40px);line-height:1.2;margin:10px 0}.intro p{color:var(--muted)}.topic-heading{font-size:23px;margin:38px 0 16px;border-bottom:2px solid #e6e5ff;padding-bottom:10px}.card{background:white;border:1px solid var(--border);border-radius:20px;padding:28px;margin:18px 0 26px;box-shadow:0 6px 22px #1e2a4b08}.small{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:1.2px}.card h3{font-size:27px;line-height:1.3;margin:8px 0 12px}.section{font-size:18px;margin:24px 0 10px}.reading{background:#f7f8ff;border:1px solid var(--border);border-radius:13px;padding:18px 20px;white-space:pre-line;line-height:1.8}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}.word{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:#fbfbff}.mode{display:flex;gap:8px;margin:12px 0}.mode button,.action{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer;color:var(--ink)}.mode button.active,.action.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.note{color:var(--muted);font-size:13px}.question{border:1px solid var(--border);border-radius:14px;padding:18px;margin:12px 0}.question h4{font-size:15px;margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:white;border:1px solid var(--border);padding:10px 12px;border-radius:10px;margin:7px 0;cursor:pointer;font:inherit;color:inherit}.option strong{color:var(--purple);min-width:22px}.option.selected{border-color:var(--purple);background:#f2f0ff}.option.correct{border-color:#69b98b;background:#eaf8ee}.option.wrong{border-color:#ed9a9a;background:#fff0f0}.explanation{background:#f7f8ff;padding:12px 14px;border-radius:10px;margin-top:10px;font-size:13px}.explanation p{margin:6px 0}.result{background:#efedff;border-radius:12px;padding:16px;font-weight:900;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}footer{text-align:center;color:var(--muted);font-size:12px;margin:40px 0}@media(max-width:650px){.container{padding:18px 11px}.card{padding:18px 13px;border-radius:15px}.card h3{font-size:22px}.reading{padding:14px}.bar{padding:13px}.brand{font-size:20px}.topic-heading{font-size:20px}}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.mini{border:1px solid var(--border);border-radius:14px;background:#f8f9ff;padding:12px;min-width:0}.mini summary{cursor:pointer;font-weight:800;color:var(--purple);list-style:none}.mini summary:after{content:' +';float:right}.mini[open] summary:after{content:' −'}.mini[open]{grid-column:1/-1}.mini .reading{margin-top:12px}.mini .vocab{margin-top:12px}@media(max-width:650px){.mini-grid{grid-template-columns:1fr}.mini[open]{grid-column:auto}} .para-list{display:grid;gap:9px}.para-item{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfbff}.para-original{font-weight:600}.para-original strong{color:var(--purple)}.para-meaning{font-size:13px;color:var(--muted);margin-top:3px}</style></head><body><header><div class="bar"><div class="brand">MAGIST <b>PRO</b></div><div class="switch"><button id="kkBtn" onclick="setLang('kk')">ҚАЗ</button><button id="ruBtn" onclick="setLang('ru')">РУС</button></div></div></header><main class="container"><div class="intro"><div class="eyebrow">ENGLISH · READING · PART 1</div><h1 id="pageTitle"></h1><p id="pageDesc"></p></div><div id="allReadings"></div><footer>MAGIST PRO · Reading Practice</footer></main><script>
const DATA=[{"topic":1,"title":"Asking a Neighbor for Help","level":"A2","text":"Cody was building a new fence all day outside. He was almost done when his hammer broke. Cody decided to ask his neighbor Gary if he had a hammer he could borrow to finish.\n\nCody knocked on Gary’s door and waited. “Hey Cody,” Gary said when he answered the door. “How are you?” “Not bad. Yourself?” Cody answered.\n\n“Good!” Gary said. “I see you have a big project going on over there. The fence looks great.” Cody smiled. “Thank you. I am almost done, but my hammer broke. Do you have one I can borrow?” “I sure do,” Gary said.\n\nCody followed Gary into the garage. Gary gave Cody a hammer to borrow. “Thank you,” Cody said. “I really appreciate it. I’ll have it back to you soon.” “Keep it as long as you need,” Gary said with a smile.","ru":"Коди весь день строил на улице новый забор. Он почти закончил, когда его молоток сломался. Коди решил спросить у соседа Гэри, может ли он одолжить молоток, чтобы закончить работу.\n\nКоди постучал в дверь Гэри и подождал. «Привет, Коди, — сказал Гэри, открыв дверь. — Как дела?» «Неплохо. А у тебя?» — ответил Коди.\n\n«Хорошо! Вижу, у тебя там большой проект. Забор отлично выглядит». Коди улыбнулся. «Спасибо. Я почти закончил, но мой молоток сломался. Можно одолжить твой?» «Конечно», — сказал Гэри.\n\nКоди пошёл за Гэри в гараж. Гэри дал ему молоток. «Спасибо, я очень благодарен. Скоро верну», — сказал Коди. «Держи столько, сколько понадобится», — с улыбкой ответил Гэри.","kk":"Коди күні бойы далада жаңа қоршау салып жүрді. Жұмысты аяқтауға жақындағанда, оның балғасы сынып қалды. Коди жұмысты бітіру үшін көршісі Гэриден балға сұрап алуды ұйғарды.\n\nКоди Гэридің есігін қағып, күтті. «Сәлем, Коди! Қалың қалай?» — деді есікті ашқан Гэри. «Жаман емес. Өзің ше?» — деп жауап берді Коди.\n\n«Жақсы! Сен үлкен жұмыс істеп жатыр екенсің. Қоршауың керемет көрінеді», — деді Гэри. Коди күлімсіреп: «Рақмет! Аяқтауға аз қалды, бірақ балғам сынып қалды. Сенікін уақытша алсам бола ма?» — деді. «Әрине», — деді Гэри.\n\nКоди Гэримен бірге гаражға кірді. Гэри оған балғасын берді. «Көп рақмет! Жақында қайтарып беремін», — деді Коди. «Қанша қажет болса, сонша уақыт пайдалана бер», — деді Гэри күлімсіреп.","words":["neighbor — сосед — көрші","borrow — одолжить — қарызға алу","fence — забор — қоршау"],"questions":[{"q":"What was Cody building?","options":["A fence","A house","A garage","A shed","A bridge"],"answer":0,"evidence":"Cody was building a new fence all day outside."},{"q":"What happened to Cody’s hammer?","options":["It disappeared","It fell into water","It broke","It was stolen","It became rusty"],"answer":2,"evidence":"He was almost done when his hammer broke."},{"q":"What did Cody do at the door?","options":["He rang a bell","He shouted","He sat down","He left a note","He knocked"],"answer":4,"evidence":"Cody knocked on Gary’s door and waited."},{"q":"Who answered the door?","options":["Cody","Gary","Gary’s wife","Cody’s brother","A delivery driver"],"answer":1,"evidence":"“Hey Cody,” Gary said when he answered the door."},{"q":"What tool broke?","options":["A screwdriver","A saw","A drill","A hammer","A shovel"],"answer":3,"evidence":"He was almost done when his hammer broke."},{"q":"Where did Cody follow Gary?","options":["To the garage","To the kitchen","To the garden","To the car","To the fence"],"answer":0,"evidence":"Cody followed Gary into the garage."},{"q":"Why did Cody visit Gary?","options":["To return a ladder","To buy some wood","To borrow a hammer","To invite him to dinner","To borrow a saw"],"answer":2,"evidence":"Cody decided to ask his neighbor Gary if he had a hammer he could borrow to finish."},{"q":"How long could Cody keep the hammer?","options":["Until lunchtime","For one hour","Until the next morning","For exactly two days","As long as he needed"],"answer":4,"evidence":"I’ll have it back to you soon.” “Keep it as long as you need,” Gary said with a smile."}]},{"topic":1,"title":"Finding the Perfect Gift for a Friend","level":"B1","text":"Choosing a special gift for a friend can be a challenge, especially if you want it to feel personal. The best gifts often reflect the friend’s hobbies, favorite colors, or interests. Some people pay attention during conversations to learn what their friends like or need. Handmade gifts, like a painted picture, a collection of favorite songs, or a homemade cake, can show extra thought and care. Sometimes, friends enjoy shared experiences more than objects, such as tickets to a concert, a movie, or a fun day out together.\n\nIt’s also important to consider the occasion and your budget. Little things, like a nice card with kind words, can mean a lot and do not have to be expensive. Giving a gift can be a way to say thank you, celebrate a birthday, or simply show appreciation for the friendship. Even if the present is simple, the effort and thought behind it can make your friend feel special. In the end, the most important thing is the feeling and message the gift brings.","ru":"Выбрать особенный подарок другу бывает непросто, особенно если хочется, чтобы он был личным. Лучшие подарки часто отражают увлечения, любимые цвета или интересы друга. Некоторые люди внимательно слушают разговоры, чтобы узнать, что нравится или нужно их друзьям. Подарки ручной работы, например нарисованная картина, подборка любимых песен или домашний торт, показывают особое внимание и заботу. Иногда друзьям больше нравятся совместные впечатления, чем вещи: билеты на концерт или в кино либо весёлый день вместе.\n\nВажно также учитывать повод и свой бюджет. Даже небольшие вещи, например красивая открытка с добрыми словами, могут много значить и не обязаны стоить дорого. Подарком можно поблагодарить человека, поздравить с днём рождения или просто выразить признательность за дружбу. Даже простой подарок способен порадовать друга благодаря вложенным усилиям и заботе. В конце концов важнее всего чувства и послание, которые несёт подарок.","kk":"Досыңа ерекше сыйлық таңдау қиын болуы мүмкін, әсіресе сыйлығыңның жеке мәні болғанын қаласаң. Ең жақсы сыйлықтар көбіне досыңның хоббиіне, сүйікті түсіне немесе қызығушылығына сәйкес келеді. Кей адамдар достарының нені ұнататынын не қажет ететінін білу үшін әңгімелерін мұқият тыңдайды. Қолдан жасалған сурет, сүйікті әндер жинағы немесе үйде пісірілген торт ерекше қамқорлықты білдіреді. Кейде достар заттан гөрі бірге өткізген уақытты ұнатады: концертке не киноға билет немесе бірге серуендеу.\n\nСыйлық таңдарда мерекенің себебі мен бюджетіңді де ескерген маңызды. Жылы сөздер жазылған әдемі ашықхат сияқты шағын нәрсенің өзі қымбат болмаса да, үлкен мәнге ие. Сыйлық арқылы алғыс айтуға, туған күнмен құттықтауға немесе достықты бағалайтыныңды көрсетуге болады. Қарапайым сыйлықтың өзінде көңіл мен еңбек болса, досыңды қуантады. Ең бастысы — сыйлық жеткізетін сезім мен ой.","words":["thoughtful — внимательный — ықыласты","budget — бюджет — бюджет","appreciation — признательность — ризашылық"],"questions":[{"q":"What can make a gift feel personal?","options":["Choosing the biggest box","Buying the most expensive item","Following every trend","Reflecting a friend’s interests","Selecting at random"],"answer":3,"evidence":"The best gifts often reflect the friend’s hobbies, favorite colors, or interests."},{"q":"Why listen during conversations?","options":["To learn what a friend likes","To practise a speech","To choose a restaurant","To learn a new language","To plan a work meeting"],"answer":0,"evidence":"Some people pay attention during conversations to learn what their friends like or need."},{"q":"Which handmade gift is mentioned?","options":["A leather wallet","A silver necklace","A painted picture","A store voucher","A new phone"],"answer":2,"evidence":"Handmade gifts, like a painted picture, a collection of favorite songs, or a homemade cake, can show extra thought and care."},{"q":"What shared experience is mentioned?","options":["A new bicycle","A designer watch","A kitchen appliance","A pair of shoes","Concert tickets"],"answer":4,"evidence":"Sometimes, friends enjoy shared experiences more than objects, such as tickets to a concert, a movie, or a fun day out together."},{"q":"What should you consider before choosing a gift?","options":["The shop’s opening hours","The occasion and budget","The size of the shopping bag","The weather forecast","The color of the receipt"],"answer":1,"evidence":"It’s also important to consider the occasion and your budget."},{"q":"What matters most in a gift?","options":["Its brand name","Its packaging weight","Its delivery speed","Its feeling and message","Its resale price"],"answer":3,"evidence":"In the end, the most important thing is the feeling and message the gift brings."},{"q":"What is one inexpensive meaningful gift?","options":["A card with kind words","A luxury watch","An expensive handbag","A new laptop","A gold bracelet"],"answer":0,"evidence":"Little things, like a nice card with kind words, can mean a lot and do not have to be expensive."},{"q":"What can a gift express besides birthday wishes?","options":["A demand for a favor","A work deadline","Appreciation for friendship","A travel warning","A shopping complaint"],"answer":2,"evidence":"Giving a gift can be a way to say thank you, celebrate a birthday, or simply show appreciation for the friendship."}]},{"topic":1,"title":"Making New Friends in a Foreign Country","level":"B2","text":"Moving to a new country brings many changes, and making friends is often one of the biggest challenges. When you arrive in an unfamiliar place, start by joining social activities, language cafes, or community clubs. This helps you meet people who share similar interests, making it easier to start conversations. Don’t be afraid to say hello or ask questions about local culture, traditions, or favorite places to visit. Taking part in group events, cooking classes, or volunteering also opens up chances to meet locals and other newcomers alike.\n\nDeveloping friendships takes time, especially in a new language or cultural setting. Practice patience and be genuine in your efforts to connect. Learning to listen and share stories helps build trust. Remember, it’s normal to feel nervous at first, but many people are happy to welcome newcomers and share their experiences. As your language and social skills improve, friendships will become stronger and more natural. Finding supportive new friends can make living in a foreign country much more fun and fulfilling, helping you feel at home even when you’re far away.","ru":"Переезд в новую страну приносит много перемен, а поиск друзей часто становится одной из самых больших трудностей. Оказавшись в незнакомом месте, начните посещать общественные мероприятия, языковые кафе или клубы. Там можно встретить людей с похожими интересами, и начать разговор будет легче. Не бойтесь здороваться и спрашивать о местной культуре, традициях и интересных местах. Групповые мероприятия, кулинарные занятия и волонтёрство также помогают познакомиться с местными жителями и другими приезжими.\n\nДля развития дружбы требуется время, особенно в новой языковой и культурной среде. Проявляйте терпение и искренность. Умение слушать и делиться историями помогает строить доверие. Поначалу нервничать нормально, но многие люди рады знакомиться с новичками и делиться опытом. По мере улучшения языковых и социальных навыков дружба становится крепче и естественнее. Поддержка новых друзей делает жизнь за границей приятнее и помогает чувствовать себя дома вдали от родины.","kk":"Жаңа елге көшу көптеген өзгеріс әкеледі, ал дос табу ең үлкен қиындықтардың бірі болуы мүмкін. Бейтаныс жерге келгенде қоғамдық іс-шараларға, тіл кафелеріне немесе клубтарға қатысудан баста. Бұл қызығушылықтары ұқсас адамдармен танысып, әңгіме бастауға көмектеседі. Сәлемдесуден, жергілікті мәдениет, дәстүр немесе көрікті орындар туралы сұраудан қорықпа. Топтық шаралар, аспаздық сабақтар мен еріктілік те жергілікті тұрғындармен және басқа жаңадан келгендермен танысуға мүмкіндік береді.\n\nДостық қалыптастыруға уақыт қажет, әсіресе жаңа тіл мен мәдениет ортасында. Сабырлы әрі шынайы бол. Тыңдай білу және өз оқиғаларыңмен бөлісу сенім тудырады. Басында қобалжу қалыпты, ал көптеген адамдар жаңадан келгендерді қуана қарсы алады. Тілдік және әлеуметтік дағдыларың дамыған сайын достық та нығайып, табиғи бола түседі. Қолдау көрсететін достар шетелдегі өмірді қызықты етіп, туған жерден алыс болсаң да өз үйіңдегідей сезінуге көмектеседі.","words":["newcomer — новичок — жаңадан келген адам","volunteering — волонтёрство — еріктілік","trust — доверие — сенім"],"questions":[{"q":"What is a common challenge after moving abroad?","options":["Finding a new television","Making friends","Buying souvenirs","Choosing a recipe","Learning to knit"],"answer":1,"evidence":"Moving to a new country brings many changes, and making friends is often one of the biggest challenges."},{"q":"Where can newcomers meet people with similar interests?","options":["Empty parking lots","Private offices after hours","Closed shops","Community clubs","Quiet storage rooms"],"answer":3,"evidence":"When you arrive in an unfamiliar place, start by joining social activities, language cafes, or community clubs."},{"q":"Why join group events or volunteer?","options":["To meet locals and newcomers","To avoid all conversations","To replace language learning","To get a guaranteed job","To stop exploring the city"],"answer":0,"evidence":"Taking part in group events, cooking classes, or volunteering also opens up chances to meet locals and other newcomers alike."},{"q":"What attitude helps develop friendships?","options":["Impatience and secrecy","Competition and suspicion","Patience and sincerity","Silence and avoidance","Pressure and criticism"],"answer":2,"evidence":"Practice patience and be genuine in your efforts to connect."},{"q":"How can listening and sharing stories help?","options":["They shorten a flight","They reduce rent","They teach cooking instantly","They remove all language barriers","They build trust"],"answer":4,"evidence":"Learning to listen and share stories helps build trust."},{"q":"What benefit can supportive friends bring?","options":["Never needing to study","Feeling at home abroad","Avoiding all travel","Getting automatic citizenship","No longer needing a job"],"answer":1,"evidence":"Finding supportive new friends can make living in a foreign country much more fun and fulfilling, helping you feel at home even when you’re far away."},{"q":"What can you ask locals about?","options":["Their bank passwords","Their private medical files","Their account numbers","Culture and favorite places","Their work passwords"],"answer":3,"evidence":"Don’t be afraid to say hello or ask questions about local culture, traditions, or favorite places to visit."},{"q":"How may friendships change as skills improve?","options":["They become stronger and more natural","They disappear immediately","They require no communication","They become less meaningful","They stop involving shared experiences"],"answer":0,"evidence":"As your language and social skills improve, friendships will become stronger and more natural."}]},{"topic":2,"title":"Making Tacos with My Family","level":"Beginner","text":"My family and I like to eat tacos. They taste really good. My dad makes the best tacos. Sometimes my brother and I will help my dad make tacos.\n\nMy dad cooks the beef. My brother and I do not because the stove is hot. Then my dad cuts the lettuce and the tomatoes.\n\nMy dad puts the beef into the taco shells. My brother and I like to put the cheese in after that. The cheese melts after we put it in because the beef is hot. My brother and I like to help put the lettuce and tomatoes in too.\n\nI can only eat one taco. My brother can eat two tacos.","ru":"Мы с семьёй любим есть тако. Они очень вкусные. Мой папа готовит самые лучшие тако. Иногда мы с братом помогаем папе их готовить.\n\nПапа жарит говядину. Мы с братом этого не делаем, потому что плита горячая. Затем папа нарезает салат и помидоры.\n\nПапа кладёт говядину в лепёшки для тако. После этого мы с братом любим добавлять сыр. Сыр плавится, потому что мясо горячее. Мы также помогаем добавлять салат и помидоры.\n\nЯ могу съесть только один тако, а мой брат — два.","kk":"Мен және отбасым тако жегенді ұнатамыз. Оның дәмі өте жақсы. Әкем ең дәмді тако жасайды. Кейде ағам екеуміз әкеме тако жасауға көмектесеміз.\n\nӘкем сиыр етін пісіреді. Пеш ыстық болғандықтан, ағам екеуміз ет пісірмейміз. Содан кейін әкем салат жапырағы мен қызанақты турайды.\n\nӘкем етті тако қабықшасына салады. Содан соң ағам екеуміз ірімшік қосқанды ұнатамыз. Ет ыстық болғандықтан ірімшік ериді. Біз салат жапырағы мен қызанақты салуға да көмектесеміз.\n\nМен бір тако ғана жей аламын. Ал ағам екі тако жей алады.","words":["stove — плита — пеш","lettuce — салат-латук — салат жапырағы","melt — таять — еру"],"questions":[{"q":"What does the family make together?","options":["Pizza","Hamburgers","Pasta","Pancakes","Tacos"],"answer":4,"evidence":"My family and I like to eat tacos."},{"q":"Who puts the beef into the taco shells?","options":["Brother","Dad","Sister","Mom","Grandma"],"answer":1,"evidence":"My dad puts the beef into the taco shells."},{"q":"What vegetables does Dad cut?","options":["Carrots and onions","Cucumbers and peppers","Potatoes and beans","Lettuce and tomatoes","Cabbage and corn"],"answer":3,"evidence":"Then my dad cuts the lettuce and the tomatoes."},{"q":"Why do the children not cook the beef?","options":["The stove is hot","They dislike beef","They are at school","The kitchen is closed","They have no pan"],"answer":0,"evidence":"My brother and I do not because the stove is hot."},{"q":"Why does the cheese melt?","options":["The lettuce is cold","The shell is wet","The beef is hot","The tomatoes are sweet","The kitchen is dark"],"answer":2,"evidence":"The cheese melts after we put it in because the beef is hot."},{"q":"How many tacos can the brother eat?","options":["One","Three","Four","Five","Two"],"answer":4,"evidence":"My brother can eat two tacos."},{"q":"What do the children add after the beef?","options":["Rice","Cheese","Fish","Eggs","Soup"],"answer":1,"evidence":"The cheese melts after we put it in because the beef is hot."},{"q":"How many tacos can the narrator eat?","options":["Two","Three","Four","One","Five"],"answer":3,"evidence":"I can only eat one taco."}]},{"topic":2,"title":"Supporting a Family Member Facing a Big Decision","level":"B1","text":"When a family member has to make an important decision, offering support can make a significant difference. My older brother was recently offered a job in another city, which would require him to move away from us for the first time. He was torn between the exciting opportunity and the comfort of staying close to family. Our family gathered one evening and listened as he shared his worries and hopes. We gave advice, suggested ways to stay in touch, and assured him that we would support whatever choice he made.\n\nDuring these conversations, I realized the power of simply listening. Instead of telling him what to do, we helped him weigh his options and feel confident in his decision. When he finally decided to accept the new job, we celebrated his courage and reminded him that home would always be here for him. Supporting someone during a big life decision isn’t about giving the right answer; it’s about showing empathy and trust in their ability to choose their own path.","ru":"Когда члену семьи нужно принять важное решение, поддержка может многое изменить. Моему старшему брату недавно предложили работу в другом городе, а это означало, что ему впервые придётся уехать далеко от нас. Он разрывался между интересной возможностью и желанием оставаться рядом с семьёй. Мы собрались однажды вечером, выслушали его тревоги и надежды, дали советы и заверили, что поддержим любое его решение.\n\nВо время этих разговоров я понял, насколько важно просто слушать. Вместо того чтобы указывать брату, что делать, мы помогли ему взвесить варианты и почувствовать уверенность в собственном решении. Когда он наконец согласился на новую работу, мы порадовались его смелости и напомнили, что дома его всегда ждут. Поддерживать человека в важном жизненном выборе — не значит давать «правильный» ответ; это значит проявлять сочувствие и доверять его способности выбрать свой путь.","kk":"Отбасы мүшесі маңызды шешім қабылдағанда, қолдау үлкен рөл атқарады. Жақында ағама басқа қаладан жұмыс ұсынылды. Бұл оның бізден алыста алғаш рет тұруы керек екенін білдірді. Ол қызықты мүмкіндік пен отбасына жақын болу қалауының арасында екіұдай күйде қалды. Бір кеште бәріміз жиналып, оның уайымы мен үмітін тыңдадық, кеңес бердік және қандай шешім қабылдаса да қолдайтынымызды айттық.\n\nСол әңгімелер кезінде мен жай ғана тыңдаудың қаншалықты маңызды екенін түсіндім. Не істеу керегін бұйырудың орнына, біз оған мүмкіндіктерін саралап, өз шешіміне сенімді болуға көмектестік. Ол жаңа жұмысты қабылдағанда, біз оның батылдығына қуанып, үйі әрқашан оны күтетінін еске салдық. Адамның маңызды таңдауын қолдау — дайын «дұрыс» жауап беру емес, жанашырлық танытып, өз жолын таңдай алатынына сену.","words":["opportunity — возможность — мүмкіндік","empathy — сочувствие — жанашырлық","assure — заверять — сендіру"],"questions":[{"q":"Why was the older brother uncertain?","options":["He disliked the offered salary","He had lost his passport","He was torn between opportunity and family","He could not speak the language","He wanted to change his name"],"answer":2,"evidence":"He was torn between the exciting opportunity and the comfort of staying close to family."},{"q":"How did the family support him?","options":["They made the decision for him","They refused to discuss it","They cancelled the job offer","They insisted he stay","They listened and offered advice"],"answer":4,"evidence":"We gave advice, suggested ways to stay in touch, and assured him that we would support whatever choice he made."},{"q":"What did the narrator learn?","options":["Advice is never useful","Listening can be powerful","Moving always fails","Families should decide careers","Jobs matter more than people"],"answer":1,"evidence":"During these conversations, I realized the power of simply listening."},{"q":"How did the family respond when he accepted?","options":["They stopped speaking to him","They demanded he return","They criticized his decision","They celebrated his courage","They cancelled the celebration"],"answer":3,"evidence":"When he finally decided to accept the new job, we celebrated his courage and reminded him that home would always be here for him."},{"q":"What is the main message?","options":["Support means empathy and trust","Always choose the closest job","Never discuss family concerns","Avoid making difficult decisions","Relatives must agree on everything"],"answer":0,"evidence":"Supporting someone during a big life decision isn’t about giving the right answer; it’s about showing empathy and trust in their ability to choose their own path."},{"q":"What did they discuss to stay connected?","options":["Selling the family home","Changing his profession","Ways to stay in touch","Cancelling his phone","Avoiding visits"],"answer":2,"evidence":"We gave advice, suggested ways to stay in touch, and assured him that we would support whatever choice he made."},{"q":"Where was the new job located?","options":["In the same house","In a nearby school","In his hometown street","In a foreign village","In another city"],"answer":4,"evidence":"My older brother was recently offered a job in another city, which would require him to move away from us for the first time."},{"q":"What did the family help him weigh?","options":["His luggage","His options","His groceries","His exercise routine","His weekly meals"],"answer":1,"evidence":"Instead of telling him what to do, we helped him weigh his options and feel confident in his decision."}]},{"topic":2,"title":"Finding Joy in Everyday Family Routines","level":"C1","text":"Amid the busyness of daily life, it’s easy to overlook the steady routines that quietly bring a family together. Simple acts such as preparing breakfast together, sharing a nightly walk, or reading aloud before bedtime can become cherished rituals that anchor everyone emotionally despite the pressures of school, work, or social obligations. These seemingly mundane routines create a sense of continuity, reassurance, and belonging that is especially valuable during periods of change or uncertainty.\n\nOver time, the repetition of these routines can foster important values and habits—like cooperation, patience, and reliable communication—that benefit every member of the household. While it may be tempting to focus on the extraordinary or wait for special occasions to feel connected, recognizing the joy in everyday togetherness often leads to the most profound happiness. Taking a moment to acknowledge and be present during these routine interactions not only strengthens relationships but also helps families create positive memories that endure well beyond the daily grind.","ru":"В суете повседневной жизни легко не заметить привычные дела, которые незаметно объединяют семью. Простые занятия — совместный завтрак, вечерняя прогулка или чтение перед сном — могут превратиться в дорогие сердцу ритуалы, эмоционально поддерживающие всех членов семьи несмотря на учёбу, работу и общественные обязанности. Эти, казалось бы, обычные привычки создают чувство постоянства, уверенности и принадлежности, особенно во времена перемен и неопределённости.\n\nСо временем повторение таких занятий развивает важные ценности и привычки: сотрудничество, терпение и надёжное общение, полезные каждому члену семьи. Хотя может возникать соблазн сосредоточиться на необычных событиях или ждать особых поводов для общения, осознание радости повседневной близости часто приносит самое глубокое счастье. Если замечать такие моменты и присутствовать в них по-настоящему, семьи не только укрепляют отношения, но и создают тёплые воспоминания, которые сохраняются надолго.","kk":"Күнделікті тіршіліктің қарбаласында отбасын біріктіретін үйреншікті істерді байқамай қалу оңай. Бірге таңғы ас ішу, кешкі серуенге шығу немесе ұйықтар алдында кітап оқу сияқты қарапайым әрекеттер оқу, жұмыс және қоғамдық міндеттерге қарамастан отбасы мүшелерін эмоционалдық тұрғыдан біріктіретін қымбат дәстүрге айналуы мүмкін. Осындай қарапайым көрінетін әдеттер, әсіресе өзгеріс пен белгісіздік кезінде, тұрақтылық, сенімділік және бірлік сезімін береді.\n\nУақыт өте қайталанатын осы істер ынтымақтастық, сабырлылық және сенімді қарым-қатынас сияқты маңызды құндылықтарды қалыптастырады. Ерекше оқиғаларды күту қызықты көрінгенімен, күнделікті бірге болудан қуаныш табу көбіне терең бақыт сыйлайды. Сол сәттерді байқап, бірге шын көңілмен өткізгенде, отбасылар байланысын нығайтып қана қоймай, ұзақ сақталатын жылы естеліктер қалыптастырады.","words":["cherished — дорогой сердцу — қадірлі","reassurance — уверенность — сенімділік","belonging — сопричастность — тиесілілік"],"questions":[{"q":"What do family routines provide during uncertainty?","options":["Continuity and reassurance","Constant excitement","Financial independence","More competition","Fewer shared experiences"],"answer":0,"evidence":"These seemingly mundane routines create a sense of continuity, reassurance, and belonging that is especially valuable during periods of change or uncertainty."},{"q":"Which routine is mentioned?","options":["Traveling abroad every weekend","Shopping every night","Preparing breakfast together","Holding daily business meetings","Changing houses monthly"],"answer":2,"evidence":"Simple acts such as preparing breakfast together, sharing a nightly walk, or reading aloud before bedtime can become cherished rituals that anchor everyone emotionally despite the pressures of school, work, or social obligations."},{"q":"What values can routines develop?","options":["Secrecy and avoidance","Competition and risk-taking","Isolation and impatience","Independence without communication","Cooperation and patience"],"answer":4,"evidence":"Over time, the repetition of these routines can foster important values and habits—like cooperation, patience, and reliable communication—that benefit every member of the household."},{"q":"What should families recognize in everyday life?","options":["The need for costly holidays","Joy in togetherness","The importance of new possessions","The value of formal meetings","The need to avoid routines"],"answer":1,"evidence":"While it may be tempting to focus on the extraordinary or wait for special occasions to feel connected, recognizing the joy in everyday togetherness often leads to the most profound happiness."},{"q":"What does being present help create?","options":["Complete agreement on everything","A life without stress","More household rules","Positive lasting memories","Less time together"],"answer":3,"evidence":"Taking a moment to acknowledge and be present during these routine interactions not only strengthens relationships but also helps families create positive memories that endure well beyond the daily grind."},{"q":"What is easy to overlook?","options":["Quiet routines that bring family together","A school timetable","Expensive celebrations","An important email","A new television"],"answer":0,"evidence":"Amid the busyness of daily life, it’s easy to overlook the steady routines that quietly bring a family together."},{"q":"When can routines be especially valuable?","options":["When nobody is home","During solitary travel","During periods of change","When communication stops","During shopping only"],"answer":2,"evidence":"These seemingly mundane routines create a sense of continuity, reassurance, and belonging that is especially valuable during periods of change or uncertainty."},{"q":"What may extraordinary occasions distract from?","options":["Homework deadlines","Cooking skills","Travel expenses","House repairs","Everyday connection"],"answer":4,"evidence":"While it may be tempting to focus on the extraordinary or wait for special occasions to feel connected, recognizing the joy in everyday togetherness often leads to the most profound happiness."}]},{"topic":3,"title":"My Job","level":"Beginner","text":"I work at a restaurant. At my job, I am very busy all day. My restaurant makes hamburgers, fried chicken, soup, and salad. I do not make the food, but I do serve the food to the customers. I bring the customers drinks, and then I ask them what they would like to eat. I say, “May I take your order?”\n\nThe customers tell me their order. I write it down in my small notebook, and then I type the order into the computer. The cooks in the kitchen receive the order, and they make the food. I bring the food to the table. Everyone in town thinks the food at my restaurant is delicious. I agree. My favorite food is the fried chicken.","ru":"Я работаю в ресторане. На работе я весь день очень занят. Наш ресторан готовит гамбургеры, жареную курицу, суп и салат. Я не готовлю еду, а подаю её посетителям. Я приношу клиентам напитки, а затем спрашиваю, что они хотят заказать. Я говорю: «Могу принять ваш заказ?»\n\nПосетители называют свой заказ. Я записываю его в маленький блокнот, а затем ввожу в компьютер. Повара на кухне получают заказ и готовят еду. Я приношу блюда к столу. Все в городе считают еду нашего ресторана очень вкусной. Я согласен. Моё любимое блюдо — жареная курица.","kk":"Мен мейрамханада жұмыс істеймін. Жұмыста күні бойы өте бос боламын. Біздің мейрамханада гамбургер, қуырылған тауық, сорпа және салат дайындалады. Мен тамақ пісірмеймін, оны қонақтарға ұсынамын. Келушілерге сусын әкелемін, содан кейін не тапсырыс бергісі келетінін сұраймын. «Тапсырысыңызды қабылдасам бола ма?» — деймін.\n\nКелушілер тапсырысын айтады. Мен оны кішкентай дәптеріме жазып, кейін компьютерге енгіземін. Асүйдегі аспаздар тапсырысты алып, тағамды дайындайды. Мен дайын тамақты үстелге апарамын. Қаладағы адамдардың бәрі біздің мейрамхананың тамағын дәмді деп санайды. Мен де келісемін. Менің сүйікті тағамым — қуырылған тауық.","words":["order — заказ — тапсырыс","customer — клиент — тұтынушы","serve — обслуживать — қызмет көрсету"],"questions":[{"q":"Where does the narrator work?","options":["At a school","At a hospital","At a bank","At a restaurant","At a library"],"answer":3,"evidence":"I work at a restaurant."},{"q":"What is the narrator’s favorite food?","options":["Fried chicken","Hamburgers","Salad","Soup","Pizza"],"answer":0,"evidence":"My favorite food is the fried chicken."},{"q":"What do people in town think of the food?","options":["It is too cold","It is too spicy","It is delicious","It is too expensive","It is unhealthy"],"answer":2,"evidence":"Everyone in town thinks the food at my restaurant is delicious."},{"q":"Who prepares the food?","options":["The waiter","The customers","The computer","The manager","The cooks"],"answer":4,"evidence":"The cooks in the kitchen receive the order, and they make the food."},{"q":"Where do the cooks work?","options":["At the table","In the kitchen","At the entrance","At the cashier desk","Outside the building"],"answer":1,"evidence":"The cooks in the kitchen receive the order, and they make the food."},{"q":"Where is the order first written?","options":["On a wall","On a receipt","On a phone screen","In a small notebook","On a menu"],"answer":3,"evidence":"I write it down in my small notebook, and then I type the order into the computer."},{"q":"What does the narrator bring to customers first?","options":["Drinks","Bills","Uniforms","Recipes","Shopping bags"],"answer":0,"evidence":"I bring the customers drinks, and then I ask them what they would like to eat."},{"q":"What does the narrator do after writing an order?","options":["Goes home","Cooks the meal","Types it into a computer","Cleans the windows","Calls another restaurant"],"answer":2,"evidence":"I write it down in my small notebook, and then I type the order into the computer."}]},{"topic":3,"title":"Work at Home vs. At Office","level":"A2","text":"Hello! My name is Regina, and I am self employed. I run a small business from my house selling insurance. What I like about my job is that I have a very flexible schedule, and I can pick how many hours and days per week I work. Normally, I work four days a week, and I try to average 25 hours over those four days. I save a lot of time by working at home because I do not have to worry about driving through a busy commute every day. Frequently, I have meetings over the phone or using the computer with my clients, and sometimes I will travel to meet with clients in person. My job is great because it gives me three-day weekends, and on slower weeks I can work less and get caught up on household chores and my other responsibilities.\n\nHi! I’m Thomas and I work in the city for a marketing company. I live in the suburbs, so each day I travel by train using a monthly rail pass. The rail pass saves me money, and I don’t have to worry about busy traffic each day by driving into the city. I normally work a 40-hour week. During the work day, I have a lot of responsibilities. I try to arrive at the office 15 minutes early to get settled, but throughout the day I have meetings with my boss and coworkers, and I have to handle many emails and phone calls with clients. I receive a one hour lunch break in the middle of the day. Usually, I pack a lunch to save money, but on Fridays I always go out to a cafe or restaurant to grab a bite to eat. I like my job because I have a lot of interaction with other people, and the days go by very quickly.","ru":"Привет! Меня зовут Регина, и я работаю на себя. Я веду небольшой страховой бизнес из дома. Больше всего мне нравится гибкий график: я могу забрать детей из школы и сама выбирать рабочие часы и дни. Обычно я работаю четыре дня в неделю и стараюсь набрать около 25 часов за эти четыре дня. Я экономлю много времени, не ездя в офис на автобусе. Когда-то я ежедневно тратила на дорогу больше часа. Часто я провожу видеовстречи с клиентами, а иногда езжу на личные встречи. Моя работа прекрасна тем, что даёт мне трёхдневные выходные, и в более спокойные недели я могу заниматься домашними делами и другими обязанностями.\n\nПривет! Я Томас, работаю в городской маркетинговой компании. Я живу в пригороде, поэтому каждый день езжу на поезде в офис. Поездка занимает тридцать минут и экономит деньги. Мне не приходится беспокоиться о пробках, которые бывают при поездке на машине. Обычно я работаю 40 часов в неделю. В течение дня у меня много обязанностей. Чтобы добраться до офиса, требуется 15 минут, но в это время я люблю встречаться с коллегами. У меня есть часовой обеденный перерыв в середине дня. Обычно я беру обед с собой, чтобы сэкономить, но по пятницам часто хожу с коллегами в кафе или ресторан. Мне нравится работа, потому что я много общаюсь с людьми и получаю удовольствие от повседневной жизни в городе.","kk":"Сәлем! Менің атым Регина, мен өз кәсібіммен айналысамын. Үйден шағын сақтандыру бизнесін жүргіземін. Ең ұнайтыны — икемді жұмыс кестесі: балаларымды мектептен алып, жұмыс сағаттары мен күндерін өзім таңдай аламын. Әдетте аптасына төрт күн жұмыс істеп, сол күндері шамамен 25 сағат еңбек етемін. Кеңсеге автобуспен бармайтындықтан көп уақыт үнемдеймін. Бұрын күн сайын жолға бір сағаттан артық уақыт кететін. Клиенттермен жиі бейнеқоңырау өткіземін, кейде олармен жеке кездесемін. Жұмысымның жақсы жағы — үш күндік демалысым бар және жұмыс аз кезде үй шаруасымен айналыса аламын.\n\nСәлем! Мен Томаспын, қаладағы маркетинг компаниясында жұмыс істеймін. Қала шетінде тұрамын, сондықтан күн сайын кеңсеге пойызбен барамын. Жолға отыз минут кетеді әрі ақша үнемдеймін. Көлік кептелісіне алаңдамаймын. Әдетте аптасына 40 сағат жұмыс істеймін. Күні бойы көптеген міндет атқарамын. Кеңсеге жетуге 15 минут қажет, сол кезде әріптестеріммен кездескенді ұнатамын. Түсте бір сағат үзілісім бар. Ақша үнемдеу үшін түскі асымды көбіне өзім әкелемін, бірақ жұма сайын әріптестеріммен кафе не мейрамханаға барамын. Жұмысым ұнайды, себебі көп адаммен араласамын және қаладағы күнделікті өмірден ләззат аламын.","words":["commute — дорога на работу — жұмысқа қатынау","flexible — гибкий — икемді","coworker — коллега — әріптес"],"questions":[{"q":"What is Regina’s job?","options":["Writer","Insurance salesperson","Painter","Housekeeper","Chef"],"answer":1,"evidence":"I run a small business from my house selling insurance."},{"q":"How many days does Regina usually work?","options":["Three","Five","Six","Four","Seven"],"answer":3,"evidence":"Normally, I work four days a week, and I try to average 25 hours over those four days."},{"q":"Which is NOT a benefit Regina mentions?","options":["Making more money","Flexible schedule","Saving commuting time","Working from home","Three-day weekends"],"answer":0,"evidence":"The rail pass saves me money, and I don’t have to worry about busy traffic each day by driving into the city."},{"q":"What industry does Thomas work in?","options":["Architecture","Pharmaceuticals","Marketing","Engineering","Education"],"answer":2,"evidence":"I’m Thomas and I work in the city for a marketing company."},{"q":"How does Thomas travel to work?","options":["By car","By bicycle","On foot","By taxi","By train"],"answer":4,"evidence":"I live in the suburbs, so each day I travel by train using a monthly rail pass."},{"q":"What is the text mainly about?","options":["Two people looking for jobs","Two people with different working arrangements","Two people planning holidays","Two people changing careers","Two people starting a business together"],"answer":1,"evidence":"I save a lot of time by working at home because I do not have to worry about driving through a busy commute every day."},{"q":"How many hours does Thomas work weekly?","options":["Twenty","Twenty-five","Thirty","Forty","Fifty"],"answer":3,"evidence":"What I like about my job is that I have a very flexible schedule, and I can pick how many hours and days per week I work."},{"q":"When does Thomas usually eat at a restaurant?","options":["On Fridays","Every Monday","Every morning","On Tuesdays","Every Sunday"],"answer":0,"evidence":"Usually, I pack a lunch to save money, but on Fridays I always go out to a cafe or restaurant to grab a bite to eat."}]},{"topic":3,"title":"Navigating the First Days in a New Workplace","level":"B2","text":"Starting a new job can be both exciting and intimidating. Adjusting to unfamiliar routines, learning about organizational culture, and meeting new colleagues often generate a mix of anticipation and nervousness. It’s normal to feel uncertain during these first days, as each workplace has its own unspoken rules and expectations. Simple actions, like greeting coworkers with a smile, asking respectful questions, and expressing willingness to learn, help lay the foundation for positive relationships and a smooth adjustment period.\n\nPatience is crucial as one gets accustomed to new responsibilities and office dynamics. Rather than aiming for instant mastery, it’s better to focus on absorbing information and observing how others interact. Finding a mentor or an approachable colleague can provide guidance and reduce the sense of isolation. Over time, small successes—like contributing an idea in a meeting or mastering a new tool—bring greater confidence. Looking back, many people realize that those initial uncertainties faded faster than they expected, replaced by a sense of belonging and purpose within their new team.","ru":"Начало новой работы может одновременно радовать и пугать. Незнакомый распорядок, корпоративная культура и встречи с новыми коллегами часто вызывают смесь ожидания и волнения. В первые дни нормально чувствовать неуверенность: на каждом рабочем месте есть неписаные правила и ожидания. Простые действия — приветствовать коллег с улыбкой, задавать уважительные вопросы и показывать готовность учиться — помогают создать хорошие отношения и легче адаптироваться.\n\nТерпение особенно важно, пока человек привыкает к новым обязанностям и офисной жизни. Вместо стремления сразу всё освоить лучше сначала собирать информацию и наблюдать за другими. Наставник или доброжелательный коллега может подсказать, как действовать, и уменьшить чувство одиночества. Со временем маленькие успехи, например полезная идея на совещании или освоение нового инструмента, придают уверенности. Оглядываясь назад, многие замечают, что первоначальная тревога прошла быстрее ожидаемого, уступив чувству принадлежности и пониманию своей роли в команде.","kk":"Жаңа жұмысқа кірісу бір мезгілде қуанышты да, қорқынышты да болуы мүмкін. Бейтаныс күн тәртібіне, ұйым мәдениетіне бейімделу және жаңа әріптестермен танысу үміт пен қобалжуды қатар тудырады. Алғашқы күндері сенімсіздік сезіну қалыпты, себебі әр жұмыс орнында жазылмаған ережелер мен талаптар болады. Әріптестермен күлімдеп амандасу, сыпайы сұрақ қою және үйренуге дайын екеніңді көрсету жақсы қарым-қатынас пен жеңіл бейімделуге негіз болады.\n\nЖаңа міндеттер мен кеңсе тәртібіне үйренгенде сабыр маңызды. Бәрін бірден меңгеруге тырысқаннан гөрі, ақпарат жинап, өзгелерді бақылаған дұрыс. Тәлімгер немесе ашық мінезді әріптес бағыт-бағдар беріп, жалғыздық сезімін азайта алады. Уақыт өте жиналыста пайдалы идея айту немесе жаңа құралды меңгеру сияқты шағын жетістіктер сенімді арттырады. Кейін көп адам алғашқы уайымының күткенінен тез басылып, оның орнына ұжымға тиесілік пен ортақ мақсат сезімі келгенін байқайды.","words":["mentor — наставник — тәлімгер","belonging — чувство причастности — тиесілілік","adjustment — адаптация — бейімделу"],"questions":[{"q":"What feeling is common when starting a new job?","options":["Only boredom","Complete confidence","Permanent anger","Total indifference","A mix of excitement and nervousness"],"answer":4,"evidence":"Adjusting to unfamiliar routines, learning about organizational culture, and meeting new colleagues often generate a mix of anticipation and nervousness."},{"q":"What can help during the first days?","options":["Avoiding all coworkers","Greeting coworkers and asking respectful questions","Demanding immediate answers","Refusing new tasks","Ignoring workplace rules"],"answer":1,"evidence":"Simple actions, like greeting coworkers with a smile, asking respectful questions, and expressing willingness to learn, help lay the foundation for positive relationships and a smooth adjustment period."},{"q":"What is recommended instead of instant mastery?","options":["Working alone without guidance","Making sudden changes","Ignoring feedback","Observing and absorbing information","Leaving early every day"],"answer":3,"evidence":"Rather than aiming for instant mastery, it’s better to focus on absorbing information and observing how others interact."},{"q":"How can a mentor help?","options":["Offer guidance and reduce isolation","Increase the workload","Delay adaptation","Prevent questions","Complicate every routine"],"answer":0,"evidence":"Finding a mentor or an approachable colleague can provide guidance and reduce the sense of isolation."},{"q":"What may replace initial uncertainty?","options":["Permanent confusion","Greater fear","A sense of belonging and purpose","More isolation","Less motivation"],"answer":2,"evidence":"Looking back, many people realize that those initial uncertainties faded faster than they expected, replaced by a sense of belonging and purpose within their new team."},{"q":"Which is a small success?","options":["Skipping all meetings","Avoiding discussions","Ignoring a new tool","Refusing responsibilities","Contributing an idea in a meeting"],"answer":4,"evidence":"Over time, small successes—like contributing an idea in a meeting or mastering a new tool—bring greater confidence."},{"q":"Why is patience important?","options":["All tasks are already familiar","Adjustment takes time","Coworkers never help","Questions are discouraged","Office routines never change"],"answer":1,"evidence":"Simple actions, like greeting coworkers with a smile, asking respectful questions, and expressing willingness to learn, help lay the foundation for positive relationships and a smooth adjustment period."},{"q":"What do workplaces have that may be unspoken?","options":["Identical schedules everywhere","No responsibilities","Guaranteed promotions","Rules and expectations","No social dynamics"],"answer":3,"evidence":"It’s normal to feel uncertain during these first days, as each workplace has its own unspoken rules and expectations."}]},{"topic":4,"title":"Learning How to Knit a Scarf","level":"Beginner","text":"My grandma taught me how to knit a scarf when I was eight years old. It is not hard to knit a scarf. First, you need two knitting needles. Then you need yarn. You should pick a color you like. For my first scarf, I picked yellow because that is my favorite color.\n\nMy grandma gave me my first knitting needles. They were made of wood. She said wood was easier for me to hold with my little hands.\n\nThen she showed me how to knit. The first step is to make a slip knot and put it on one of the knitting needles. Then you make more loops around the knitting needle. After that, you use both needles to knit. My first scarf was not the best one I ever made, but I was proud of it.","ru":"Моя бабушка научила меня вязать шарф, когда мне было восемь лет. Связать шарф несложно. Сначала нужно взять вязальные спицы. Затем — пряжу. Выберите цвет, который вам нравится. Для своего первого шарфа я выбрала жёлтый, потому что это мой любимый цвет.\n\nБабушка подарила мне мои первые спицы. Они были деревянными. Она сказала, что маленькими руками мне будет удобнее держать деревянные спицы.\n\nЗатем она показала, как вязать. Первый шаг — сделать скользящий узел и надеть его на одну спицу. Потом нужно набрать петли на спицу. После этого вязать двумя спицами. Мой первый шарф был не самым красивым из всех, что я делала, но я им гордилась.","kk":"Мен сегіз жасымда әжем маған шарф тоқуды үйретті. Шарф тоқу қиын емес. Алдымен тоқу инелерін алу керек. Содан кейін жіп қажет. Өзіңе ұнайтын түсті таңда. Алғашқы шарфыма сары түсті таңдадым, себебі ол менің сүйікті түсім.\n\nӘжем маған алғашқы тоқу инелерімді берді. Олар ағаштан жасалған еді. Әжем кішкентай қолыма ағаш инелерді ұстау жеңіл болатынын айтты.\n\nСодан кейін ол маған тоқуды көрсетті. Алғашқы қадам — сырғымалы түйін жасап, оны бір инеге кигізу. Одан кейін инеге ілмектерді жинайсың. Сосын екі инемен тоқисың. Алғашқы шарфым мен жасағандардың ең әдемісі болмаса да, мен оны мақтан тұттым.","words":["knit — вязать — тоқу","yarn — пряжа — жіп","needle — спица — біз"],"questions":[{"q":"Who taught the narrator to knit?","options":["Her mother","Her father","Her grandma","Her brother","Her teacher"],"answer":2,"evidence":"My grandma taught me how to knit a scarf when I was eight years old."},{"q":"How old was she when she first knitted?","options":["Ten","Twelve","Thirteen","Six","Eight"],"answer":4,"evidence":"My grandma taught me how to knit a scarf when I was eight years old."},{"q":"What color did she choose?","options":["Blue","Yellow","Green","Red","Purple"],"answer":1,"evidence":"For my first scarf, I picked yellow because that is my favorite color."},{"q":"What were her first needles made of?","options":["Metal","Plastic","Bamboo","Wood","Glass"],"answer":3,"evidence":"They were made of wood."},{"q":"Who gave her the needles?","options":["Her grandma","Her aunt","Her friend","Her father","Her neighbor"],"answer":0,"evidence":"My grandma gave me my first knitting needles."},{"q":"How did she feel about her first scarf?","options":["Ashamed of it","Angry about it","Proud of it","Bored with it","Afraid of it"],"answer":2,"evidence":"My first scarf was not the best one I ever made, but I was proud of it."},{"q":"What is the first step in knitting described?","options":["Cut the finished scarf","Wash the yarn","Sew on a button","Paint the needles","Make a slip knot"],"answer":4,"evidence":"The first step is to make a slip knot and put it on one of the knitting needles."},{"q":"Why did Grandma choose wooden needles?","options":["They were the most expensive","They were easier for small hands to hold","They were very heavy","They were brightly painted","They were disposable"],"answer":1,"evidence":"She said wood was easier for me to hold with my little hands."}]},{"topic":4,"title":"The Art of Saying No Politely","level":"B2","text":"Learning how to say no is an important skill for building healthy relationships and managing your own stress. Sometimes, people may ask for favors or invite you to events that you do not want to attend. While it is normal to want to help others, accepting every request can lead to exhaustion. To refuse an invitation or extra responsibility politely, it is useful to thank the other person for thinking of you and then offer a brief but honest explanation for your decision.\n\nPracticing polite ways of saying no can actually strengthen your relationships. When you draw clear boundaries, others are more likely to respect your needs and trust your honesty. For example, you can say, “I’m sorry, I have other commitments that day,” or “Thank you for inviting me, but I need some time for myself.” Over time, expressing your limits in a kind way can help you maintain a balance between helping others and taking care of your own well-being.","ru":"Умение вежливо говорить «нет» важно для здоровых отношений и управления собственным стрессом. Иногда люди просят об одолжении или приглашают на мероприятия, которые вы не хотите посещать. Хотя желание помогать другим естественно, согласие на каждую просьбу может привести к истощению. Чтобы отказаться от приглашения или дополнительной обязанности вежливо, полезно поблагодарить человека за предложение и кратко, но честно объяснить своё решение.\n\nВежливый отказ способен укреплять отношения. Когда вы обозначаете ясные границы, другие люди с большей вероятностью уважают ваши потребности и доверяют вашей искренности. Например, можно сказать: «Извините, у меня в этот день другие планы» или «Спасибо за приглашение, но мне нужно немного времени для себя». Со временем доброжелательное выражение своих ограничений помогает находить баланс между помощью другим и заботой о собственном благополучии.","kk":"Сыпайы түрде «жоқ» деп айта білу — дұрыс қарым-қатынас құру және өз күйзелісіңді басқару үшін маңызды дағды. Кейде адамдар сенен көмек сұрайды немесе барғың келмейтін іс-шараларға шақырады. Басқаларға көмектескің келуі табиғи, бірақ әр өтінішке келісу шаршауға әкелуі мүмкін. Шақырудан немесе қосымша міндеттен сыпайы бас тарту үшін алдымен ұсынысқа алғыс айтып, шешіміңді қысқа әрі шынайы түсіндірген жөн.\n\nСыпайы бас тарту қарым-қатынасты нығайта алады. Шекараңды анық көрсеткенде, өзгелер сенің қажеттіліктеріңді көбірек құрметтеп, шынайылығыңа сенеді. Мысалы: «Кешіріңіз, ол күні басқа жоспарым бар» немесе «Шақырғаныңызға рақмет, бірақ өзіме біраз уақыт керек» деуге болады. Уақыт өте шектеулеріңді мейірімді түрде білдіру басқаларға көмектесу мен өзіңе қамқорлық жасаудың тепе-теңдігін сақтауға көмектеседі.","words":["boundary — граница — шекара","exhaustion — истощение — шаршау","commitment — обязательство — міндеттеме"],"questions":[{"q":"Why is saying no important?","options":["It helps manage stress and relationships","It makes others dependent","It increases workload","It encourages every invitation","It avoids all social contact"],"answer":0,"evidence":"Learning how to say no is an important skill for building healthy relationships and managing your own stress."},{"q":"What can happen if you accept every request?","options":["You automatically improve relationships","Everyone stops asking favors","You may become exhausted","You gain unlimited free time","You never feel stressed"],"answer":2,"evidence":"Sometimes, people may ask for favors or invite you to events that you do not want to attend."},{"q":"How should you refuse an invitation politely?","options":["Criticize the invitation","Ignore the message","Accept then cancel at the last minute","Blame someone else","Thank the person and explain honestly"],"answer":4,"evidence":"To refuse an invitation or extra responsibility politely, it is useful to thank the other person for thinking of you and then offer a brief but honest explanation for your decision."},{"q":"What can polite boundaries do?","options":["Create permanent confusion","Strengthen relationships","End all friendships","Make honesty unnecessary","Prevent communication"],"answer":1,"evidence":"Practicing polite ways of saying no can actually strengthen your relationships."},{"q":"Which is a polite refusal?","options":["Why did you invite me?","I do not like your events","Never ask me again","I have other commitments that day","Your invitation is pointless"],"answer":3,"evidence":"For example, you can say, “I’m sorry, I have other commitments that day,” or “Thank you for inviting me, but I need some time for myself.” Over time, expressing your limits in a kind way can help you maintain a balance between helping others and taking care of"},{"q":"What is a benefit of kind limits?","options":["Balancing care for others and yourself","Always putting others first","Avoiding every responsibility","Becoming unreliable","Stopping all invitations"],"answer":0,"evidence":"For example, you can say, “I’m sorry, I have other commitments that day,” or “Thank you for inviting me, but I need some time for myself.” Over time, expressing your limits in a kind way can help you maintain a balance between helping others and taking care of"},{"q":"What should a refusal explanation be?","options":["Long and invented","Angry and personal","Brief and honest","Vague and insulting","Public and embarrassing"],"answer":2,"evidence":"To refuse an invitation or extra responsibility politely, it is useful to thank the other person for thinking of you and then offer a brief but honest explanation for your decision."},{"q":"What are others more likely to respect when you set boundaries?","options":["Your shopping list","Your favorite color","Your travel tickets","Your office furniture","Your needs"],"answer":4,"evidence":"When you draw clear boundaries, others are more likely to respect your needs and trust your honesty."}]},{"topic":5,"title":"How to Stay Healthy","level":"A2","text":"Staying healthy is important for a happy life. Every day, it is good to eat fruits and vegetables, drink enough water, and not eat too much sugar or fast food. Try to get enough sleep every night. This will help your body and mind work well. Also, move your body, even if it is only a short walk, some simple exercises, or playing with friends.\n\nWashing your hands before eating and after using the toilet is also important. Try not to touch your face too much with your hands. Sometimes people feel sad, tired, or stressed. You can talk to someone you trust, or do something you enjoy, like listening to music. Taking care of your body and mind helps you feel good every day.","ru":"Здоровье важно для счастливой жизни. Каждый день полезно есть фрукты и овощи, пить достаточно воды и не употреблять слишком много сахара или фастфуда. Старайтесь высыпаться каждую ночь. Это помогает телу и разуму хорошо работать. Также важно двигаться, даже если это короткая прогулка, простые упражнения или игры с друзьями.\n\nВажно мыть руки перед едой и после туалета. Старайтесь не трогать лицо руками слишком часто. Иногда люди грустят, устают или испытывают стресс. Можно поговорить с человеком, которому доверяете, или заняться тем, что нравится, например послушать музыку. Забота о теле и психическом состоянии помогает чувствовать себя хорошо каждый день.","kk":"Денсаулық бақытты өмір үшін маңызды. Күн сайын жеміс пен көкөніс жеп, жеткілікті су ішіп, қант пен фастфудты шамадан тыс тұтынбаған дұрыс. Әр түнде жеткілікті ұйықтауға тырыс. Бұл дене мен ойдың жақсы жұмыс істеуіне көмектеседі. Қысқа серуен болса да, жеңіл жаттығу немесе достармен ойын болса да, қозғалған пайдалы.\n\nТамақ ішер алдында және дәретханадан кейін қол жуу да маңызды. Бетіңді қолыңмен жиі ұстамауға тырыс. Кейде адамдар мұңаяды, шаршайды немесе күйзеліске түседі. Ондайда сенетін адамыңмен сөйлесуге немесе музыка тыңдау сияқты ұнайтын іспен айналысуға болады. Денең мен көңіл күйіңе қамқорлық жасау күн сайын өзіңді жақсы сезінуге көмектеседі.","words":["healthy — здоровый — дені сау","trust — доверять — сену","exercise — упражнение — жаттығу"],"questions":[{"q":"What should you eat every day?","options":["Only sweets","Only fast food","Only fried food","Fruits and vegetables","Only bread"],"answer":3,"evidence":"Every day, it is good to eat fruits and vegetables, drink enough water, and not eat too much sugar or fast food."},{"q":"Why is sleep important?","options":["It helps body and mind work well","It prevents all exercise","It replaces drinking water","It makes vegetables unnecessary","It stops social contact"],"answer":0,"evidence":"This will help your body and mind work well."},{"q":"When should you wash your hands?","options":["After watching television","Before going for a walk","Before eating and after using the toilet","After listening to music","Before reading a book"],"answer":2,"evidence":"Washing your hands before eating and after using the toilet is also important."},{"q":"What is a good way to move your body?","options":["Watching videos all day","Eating more sweets","Sitting for many hours","Skipping exercise","Taking a short walk"],"answer":4,"evidence":"Also, move your body, even if it is only a short walk, some simple exercises, or playing with friends."},{"q":"What can you do if you feel stressed?","options":["Drink less water","Talk to someone you trust","Avoid all friends","Skip sleeping","Eat more fast food"],"answer":1,"evidence":"You can talk to someone you trust, or do something you enjoy, like listening to music."},{"q":"Why avoid touching your face too much?","options":["To improve eyesight immediately","To grow taller","To become stronger instantly","To help keep yourself healthy","To stop feeling hungry"],"answer":3,"evidence":"Staying healthy is important for a happy life."},{"q":"What should you drink enough of?","options":["Water","Soda","Energy drinks","Sweet syrup","Coffee only"],"answer":0,"evidence":"Every day, it is good to eat fruits and vegetables, drink enough water, and not eat too much sugar or fast food."},{"q":"What relaxing activity is mentioned?","options":["Driving in traffic","Doing extra paperwork","Listening to music","Skipping meals","Working all night"],"answer":2,"evidence":"You can talk to someone you trust, or do something you enjoy, like listening to music."}]},{"topic":5,"title":"Recognizing Warning Signs of a Stroke","level":"B2","text":"A stroke happens when the blood supply to part of the brain is interrupted or reduced, which stops the brain from getting oxygen and nutrients. This can lead to rapid brain cell death and requires immediate medical attention. Common warning signs include sudden numbness or weakness in the face, arm, or leg, especially on one side of the body. You might also notice confusion, trouble speaking clearly, or difficulty understanding others. Other symptoms can be problems seeing in one or both eyes and sudden trouble walking, dizziness, or loss of balance.\n\nIf you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred speech; Time—if you see any of these signs, call emergency services right away. Quick action is very important. The sooner a stroke victim gets medical help, the better their chance of minimizing damage and making a good recovery.","ru":"Инсульт возникает, когда кровоснабжение части мозга прерывается или уменьшается, из-за чего мозг не получает кислород и питательные вещества. Это может быстро привести к гибели клеток мозга и требует немедленной медицинской помощи. Частые тревожные признаки — внезапное онемение или слабость лица, руки или ноги, особенно с одной стороны тела. Также могут появиться спутанность сознания, невнятная речь или трудности с пониманием чужих слов. Другие симптомы — ухудшение зрения в одном или обоих глазах, внезапные проблемы с ходьбой, головокружение или потеря равновесия.\n\nЕсли вы подозреваете инсульт, вспомните тест FAST: Face (лицо) — попросите человека улыбнуться и проверьте, не опускается ли одна сторона лица; Arms (руки) — попросите поднять обе руки и посмотрите, не опускается ли одна; Speech (речь) — попросите что-нибудь сказать и прислушайтесь к необычной или невнятной речи; Time (время) — при любом из этих признаков немедленно вызовите экстренные службы. Быстрые действия крайне важны. Чем раньше пострадавший получит медицинскую помощь, тем выше вероятность уменьшить повреждения и успешно восстановиться.","kk":"Инсульт мидың бір бөлігіне қан келуі тоқтағанда немесе азайғанда болады. Соның салдарынан ми оттегі мен қоректік заттарды ала алмайды. Бұл ми жасушаларының тез зақымдануына әкеліп, шұғыл медициналық көмекті қажет етеді. Негізгі қауіпті белгілер — беттің, қолдың немесе аяқтың, әсіресе дененің бір жағында, кенет ұюы не әлсіреуі. Адам шатасуы, анық сөйлей алмауы немесе өзгелердің сөзін түсінбеуі мүмкін. Сондай-ақ бір немесе екі көздің көруі нашарлап, кенет жүру қиындауы, бас айналуы немесе тепе-теңдік жоғалуы мүмкін.\n\nИнсультке күмәндансаң, FAST тексеруін есіңе түсір: Face (бет) — адамнан күлімсіреуін сұрап, бетінің бір жағы салбырап тұрмағанын қара; Arms (қолдар) — екі қолын көтеруін сұрап, бір қолы төмен түсіп кетпейтінін бақыла; Speech (сөйлеу) — сөйлетіп, сөзі түсініксіз немесе бұлыңғыр естілмейтінін тыңда; Time (уақыт) — осы белгілердің бірі байқалса, дереу жедел жәрдем шақыр. Жылдам әрекет ету өте маңызды. Медициналық көмек неғұрлым ерте көрсетілсе, зақым азайып, сауығу мүмкіндігі соғұрлым жоғары болады.","words":["stroke — инсульт — инсульт","numbness — онемение — ұю","emergency — экстренная ситуация — шұғыл жағдай"],"questions":[{"q":"What causes a stroke?","options":["Too much oxygen to the brain","Reduced or interrupted blood supply to the brain","A broken leg","A mild headache after reading","A stomach infection"],"answer":1,"evidence":"A stroke happens when the blood supply to part of the brain is interrupted or reduced, which stops the brain from getting oxygen and nutrients."},{"q":"Which is a common warning sign?","options":["A cough for several days","Slow hair growth","A mild appetite change","Sudden weakness on one side","A small skin scratch"],"answer":3,"evidence":"Common warning signs include sudden numbness or weakness in the face, arm, or leg, especially on one side of the body."},{"q":"What does F in FAST mean?","options":["Face","Feet","Fatigue","Fingers","Food"],"answer":0,"evidence":"If you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred sp"},{"q":"What should you do if you suspect a stroke?","options":["Wait several days","Offer a large meal","Call emergency services immediately","Ask the person to sleep","Ignore the symptoms"],"answer":2,"evidence":"If you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred sp"},{"q":"Why is quick action important?","options":["It prevents common colds","It removes the need for doctors","It guarantees no further problems","It makes symptoms harmless","It may reduce damage and improve recovery"],"answer":4,"evidence":"The sooner a stroke victim gets medical help, the better their chance of minimizing damage and making a good recovery."},{"q":"Which symptom is NOT mentioned?","options":["Dizziness","Persistent fever","Trouble walking","Vision problems","Sudden numbness"],"answer":1,"evidence":"You might also notice confusion, trouble speaking clearly, or difficulty understanding others."},{"q":"What do you check in the Arms part of FAST?","options":["Whether fingers can snap","Whether legs can jump","Whether hands are cold","Whether one raised arm drifts downward","Whether shoulders are relaxed"],"answer":3,"evidence":"If you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred sp"},{"q":"What does T in FAST remind you?","options":["Time to call emergency services","Take a nap","Try eating something","Travel to work","Test again next week"],"answer":0,"evidence":"If you suspect someone is having a stroke, remember the FAST test: Face—ask the person to smile and see if one side droops; Arms—ask them to raise both arms and see if one arm drifts downward; Speech—ask the person to speak and listen for strange or slurred sp"}]},{"topic":5,"title":"Taking Care of Your Teeth","level":"B1","text":"Good teeth are important for a happy smile. You should brush your teeth every morning and every night. Use a toothbrush and a little toothpaste. Brush your teeth gently for two minutes. Remember to brush all your teeth, not just the front ones. After brushing, rinse your mouth with clean water.\n\nYou should also see a dentist twice a year. The dentist checks your teeth and helps keep them healthy. Do not eat too many sweets, as they can hurt your teeth. Drink water instead of soda. Taking care of your teeth every day is easy. Healthy teeth help you eat, speak, and smile with confidence.","ru":"Здоровые зубы важны для красивой улыбки. Чистите зубы каждое утро и каждый вечер. Используйте зубную щётку и немного пасты. Аккуратно чистите зубы две минуты. Не забывайте чистить все зубы, а не только передние. После чистки прополощите рот чистой водой.\n\nТакже нужно посещать стоматолога дважды в год. Врач проверяет зубы и помогает поддерживать их здоровье. Не ешьте слишком много сладостей: они могут навредить зубам. Пейте воду вместо газировки. Ежедневно заботиться о зубах несложно. Здоровые зубы помогают уверенно есть, говорить и улыбаться.","kk":"Сау тістер әдемі күлкі үшін маңызды. Тісті әр таңертең және әр кеште тазалау керек. Тіс щеткасы мен аздап тіс пастасын қолдан. Тісті екі минут бойы ақырын тазала. Алдыңғы тістерді ғана емес, барлық тістерді тазалауды ұмытпа. Тазалағаннан кейін аузыңды таза сумен шай.\n\nЖылына екі рет тіс дәрігеріне қаралған дұрыс. Дәрігер тістеріңді тексеріп, оларды сау ұстауға көмектеседі. Тәттіні көп жеме, өйткені ол тіске зиян тигізуі мүмкін. Газдалған сусынның орнына су іш. Күн сайын тіс күтімімен айналысу қиын емес. Сау тістер тамақ жеуге, сөйлеуге және сенімді күлімсіреуге көмектеседі.","words":["toothbrush — зубная щётка — тіс щеткасы","dentist — стоматолог — тіс дәрігері","rinse — полоскать — шаю"],"questions":[{"q":"How often should you brush your teeth?","options":["Once a week","Only after sweets","Once a month","Only in the morning","Every morning and night"],"answer":4,"evidence":"You should brush your teeth every morning and every night."},{"q":"What should you use to brush your teeth?","options":["A spoon and salt","A toothbrush and toothpaste","A hairbrush and water","A towel and soap","A finger and soap"],"answer":1,"evidence":"Use a toothbrush and a little toothpaste."},{"q":"How long should you brush?","options":["Ten seconds","Half an hour","Ten minutes","Two minutes","One hour"],"answer":3,"evidence":"Brush your teeth gently for two minutes."},{"q":"Why should you visit a dentist twice a year?","options":["To check and keep teeth healthy","To buy sweets","To learn games","To avoid brushing","To get a new toothbrush daily"],"answer":0,"evidence":"The dentist checks your teeth and helps keep them healthy."},{"q":"What should you drink instead of soda?","options":["Milkshakes","Lemonade","Water","Energy drinks","Sweet juice"],"answer":2,"evidence":"Drink water instead of soda."},{"q":"What do healthy teeth help you do?","options":["Run faster","Hear better","See at night","Sleep less","Eat, speak, and smile confidently"],"answer":4,"evidence":"Healthy teeth help you eat, speak, and smile with confidence."},{"q":"Which teeth should you brush?","options":["Only the front teeth","All teeth, not just the front ones","Only the upper teeth","Only the back teeth","Only the lower teeth"],"answer":1,"evidence":"Remember to brush all your teeth, not just the front ones."},{"q":"What should you do after brushing?","options":["Eat candy immediately","Drink soda","Skip rinsing","Rinse your mouth with clean water","Brush with soap"],"answer":3,"evidence":"After brushing, rinse your mouth with clean water."}]}];
